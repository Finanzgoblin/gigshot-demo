<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<!-- Self-hosted, pinned (public/vendor/, copied from node_modules at build).
  No CDN dependency, no document.write fallback loader, no third-party
  origin in the load path — served from the same origin as the app, which
  removes the L-2 finding and the S-5 availability gap in one move. -->
<link href="vendor/maplibre-gl.css" rel="stylesheet" />
<script src="vendor/maplibre-gl.js"></script>
<style>
  html, body, #map { margin: 0; height: 100%; background: #0c0a14; }
  /* Marker elements carry inline z-index (1–10); a maplibre popup defaults to
     auto, so without this the popup card renders BEHIND nearby markers (the
     "info box in the background" bug). Lift every gigshot popup above all pins. */
  .gigshot-popup { z-index: 20; }
  .gigshot-popup .maplibregl-popup-content {
    background: #1a1626;
    border: 1px solid #2c2540;
    border-radius: 12px;
    padding: 0;
    box-shadow: 0 8px 30px rgba(0,0,0,.5);
  }
  .gigshot-popup .maplibregl-popup-tip { border-top-color: #2c2540; }
  /* The availability legend moved into MapBottomSheet's RN header (real React
     state, not a shell-side static div): see src/components/map/MapBottomSheet.tsx. */
  /* Soft amber pulse on "looking" (open-request/demand) pins: a second
     box-shadow ring animates on top of the resting shadow already set via
     el.style.cssText in window.setDemandPoints below. Reduced-motion is
     respected two ways: the RN-side reducedMotion flag (threaded through
     pushDemandPoints -> setDemandPoints's second argument) skips adding the
     .gs-pulse class at all, and this @media query is a belt-and-suspenders
     backstop for the browser/OS-level preference (covers web races where the
     RN flag hasn't fired yet on first paint; native has no media query at all,
     so the JS flag is the only guard there). */
  @keyframes gs-beacon-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(245,158,11,0.55); }
    50% { box-shadow: 0 0 0 8px rgba(245,158,11,0); }
  }
  .gs-pulse { animation: gs-beacon-pulse 1.8s ease-in-out infinite; }
  /* F3 seam (spec §2): supply markers fade as a CLASS, never unmount. Teardown
     and rebuild at the seam IS the jank the crossfade exists to remove, and it
     would drop any open card with it (spec §2.6).
     The WHOLE transition list lives here rather than in styleMarker's inline
     style, and that is load-bearing: an inline "transition" shorthand beats a
     class rule outright, so a class-only opacity transition would be silently
     overridden and the seam would hard-cut. Keeping the list in CSS is also
     what lets the reduced-motion block below zero it without !important.
     opacity DOES need !important: styleMarker writes an inline el.style.opacity
     for the dim treatment, and the seam must win over it.
     pointer-events off while faded so an invisible pin never steals a tap from
     the bubble underneath (paint is not interactivity, spec §2.1). */
  .gs-supply { transition: opacity 220ms ease-out, width .18s, height .18s, box-shadow .18s, border-color .18s; }
  /* visibility, not only opacity: an opacity-0 element STAYS IN THE
     ACCESSIBILITY TREE, so without this the up-to-60 faded pins keep announcing
     their aria-labels to a screen reader while the map shows bubbles, and keep
     taking tab-like traversal. visibility:hidden removes them from the tree.
     The 0s 220ms DELAY is what preserves the fade: hiding waits for the opacity
     transition to finish. On the UN-hide path this whole rule stops matching, so
     .gs-supply's plain transition applies instead, visibility flips back
     instantly and only the opacity animates.
     THIS RULE'S POSITION IS LOAD-BEARING: it must come BEFORE the media block
     below, which repeats this exact selector at exactly equal specificity
     (0,2,0). Move it after and reduced motion silently stops zeroing this
     state's duration and its visibility delay. */
  .gs-agg-bubbles .gs-supply {
    opacity: 0 !important;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 220ms ease-out, visibility 0s 220ms;
  }
  /* FOLDING (spec 2026-09-05-map-pin-declutter §3.4): below the seam an event is
     represented exactly ONCE. A pill whose event is inside a cluster hides,
     because that cluster's own cyan badge already draws it — the
     .gs-agg-bubbles .gs-supply rule one class over, with refold() deciding
     membership instead of the mode.
     THE TRANSITION LIST LIVES ON THE BASE CLASS, never on the state class: the
     state rule stops matching the instant gs-folded is removed, so a list held
     there would fade OUT and SNAP back IN. Here both directions animate.
     No !important on the transition: the pill writes no inline transition (the
     lesson .gs-supply's own comment records — an inline shorthand beats a class
     rule outright). The !important on opacity below is defensive parity with
     that rule: the pill DOES write a whole inline cssText block, so an opacity
     added to it later would silently win over the fold. */
  /* WIDENED 2026-09-05 (spec 2026-09-05-map-demand-union §2.4): the amber demand
     badge folds by the identical mechanism - its cluster's amber digit already
     counts it - so it shares the identical fade. An ADDITIVE selector, never a
     rename: every claim this stylesheet and its pins already make about
     .gs-event is untouched, and the two kinds can never fade differently. */
  .gs-event, .gs-gig { transition: opacity 220ms ease-out; }
  /* Three declarations, three separate failures if one is dropped: opacity
     hides it, visibility removes an aria-labelled ghost from the accessibility
     tree (opacity:0 does NOT), and pointer-events keeps an invisible pill from
     stealing the tap that belongs to the cluster underneath it — §3.5 makes the
     cluster the tap target for a folded pill. The 0s 220ms delay is what lets
     the fade finish before the hide; the un-fold path stops matching this rule
     entirely, so visibility flips back instantly and only opacity animates.
     POSITION IS LOAD-BEARING, exactly as the supply pair above: the media block
     below repeats these selectors at equal specificity (0,1,0) and wins only by
     coming later. */
  .gs-folded {
    opacity: 0 !important;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 220ms ease-out, visibility 0s 220ms;
    /* A FOURTH declaration, added by the demand wave: the amber badge is the one
       folding satellite that carries an infinite animation (.gs-pulse, the
       beacon). opacity:0 does not stop it - box-shadow keeps compositing every
       frame on an element nobody can see, on exactly the map that is already
       busy enough to have clustered. No conflict with the fade: the pulse writes
       box-shadow, the fold writes opacity.
       IN CSS RATHER THAN A JS TOGGLE, and that is the load-bearing half. The
       pulse class is added only when reduced motion is OFF, so a JS remove in
       refold would have to re-consult reduceMotionFlag on every UNFOLD to know
       whether it may put the class back - a second reader of a preference this
       shell keeps single-sourced, and a permanently dead beacon the day someone
       forgets. A cascade rule needs no memory: the class stays on the element
       and simply stops animating while this rule matches.
       THIS DECLARATION'S POSITION IS LOAD-BEARING TOO, for the same reason the
       rule's own header says the media block must follow it: .gs-pulse (0,1,0)
       and .gs-folded (0,1,0) are an exact specificity tie, so animation:none
       wins ONLY because .gs-pulse is emitted ABOVE. Move the pulse rule below
       this one - a plausible tidy-up, since the reduced-motion copy of it lives
       just there - and every folded amber badge keeps compositing box-shadow at
       1.8s intervals on an invisible element, with no visible symptom. Pinned by
       tests/map-shell-fold.test.ts, mirroring the .gs-agg-bubbles .gs-supply
       note above. */
    animation: none;
  }
  @media (prefers-reduced-motion: reduce) {
    .gs-pulse { animation: none; }
    /* The crossfade still HAPPENS, it just happens instantly: zeroing duration
       AND delay keeps every state change (fade, resize, ring, the visibility
       step) correct and only removes the motion. BOTH selectors are listed
       because the bubbles-mode rule above is the more specific one, so a bare
       .gs-supply override would never reach the faded state — and this block
       must stay BELOW that rule, since the repeat of its selector here ties it
       on specificity and wins only by coming later. */
    .gs-supply,
    .gs-agg-bubbles .gs-supply { transition-duration: 0ms; transition-delay: 0s; }
    /* The fold fade (spec §4.4), appended INSIDE this block rather than beside
       it so the pinned cascade order above is untouched. BOTH classes: zeroing
       only .gs-event would leave the folded state's own re-declared 220ms
       shorthand (and its visibility delay) running. .gs-gig joined them with the
       demand wave: omitting it would leave the amber badge the ONE satellite
       that still slides under a reduced-motion preference. */
    .gs-event, .gs-gig, .gs-folded { transition-duration: 0ms; transition-delay: 0s; }
  }
  /* The JS half of the reduced-motion guard, mirroring the block above. The
     media query is a browser/OS preference and NATIVE HAS NO MEDIA QUERY AT ALL
     (the same split the .gs-pulse comment documents), so the host's own
     reducedMotion flag arrives through setDemandPoints and toggles .gs-rm on the
     map container.
     Its position relative to the media block is NOT load-bearing (an earlier
     comment here claimed it was): .gs-rm.gs-agg-bubbles .gs-supply is strictly
     MORE specific (0,3,0) than anything in that block, so it wins wherever both
     apply whatever the order, and the bare .gs-rm .gs-supply sets the identical
     two declarations. Specificity resolves it. The ONE ordering that does carry
     weight in this stylesheet is .gs-agg-bubbles .gs-supply before the media
     block — see the note on that rule. */
  .gs-rm .gs-supply,
  .gs-rm.gs-agg-bubbles .gs-supply { transition-duration: 0ms; transition-delay: 0s; }
  /* The fold half of the same JS-flag guard (spec §4.4). A SEPARATE rule rather
     than two more selectors on the one above, so the two pins that read that
     rule's exact selector list keep reading it. Order-free: .gs-rm .gs-folded is
     (0,2,0), strictly more specific than the media block's (0,1,0) copy, so
     specificity resolves it wherever both apply. */
  .gs-rm .gs-event,
  .gs-rm .gs-gig,
  .gs-rm .gs-folded { transition-duration: 0ms; transition-delay: 0s; }
  /* Zoom (+/-) control (MapLibre NavigationControl). The search pill + filters
     chip row are a React overlay ABOVE this iframe, so a top-right control
     collides with them (founder: "the +/- overlaps the search bar"). Push it
     DOWN clear of that chrome, and restyle from MapLibre's default white to the
     app's dark theme. */
  .maplibregl-ctrl-top-right { margin-top: 120px; margin-right: 10px; }
  .maplibregl-ctrl-group {
    background: #1a1626;
    border: 1px solid #2c2540;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,.4);
    overflow: hidden;
  }
  .maplibregl-ctrl-group button { background: transparent; width: 34px; height: 34px; }
  .maplibregl-ctrl-group button + button { border-top: 1px solid #2c2540; }
  .maplibregl-ctrl-group button:hover { background: #14111f; }
  /* MapLibre's +/- glyphs are dark SVGs; invert them to read on the dark fill. */
  .maplibregl-ctrl-group button .maplibregl-ctrl-icon { filter: invert(0.85); }
</style>
</head>
<body>
<div id="map"></div>
<script>
let POINTS = JSON.parse(decodeURIComponent(location.hash.slice(1) || '%5B%5D'));
// THE OTHER TWO THIRDS of the cluster union (spec §3.1, widened by the
// demand-union spec §2.1). Kept beside POINTS because all three are read
// TOGETHER by refreshClusterSource and by the count gate: a creator, an event
// and an open gig standing in the same city are members of ONE cluster now, not
// three independent marker sets that happen to overlap. Each setter owns its own
// assignment (setEventPoints, setDemandPoints); nothing else writes either one
// except enablePicker's clear.
let EVENT_POINTS = [];
let DEMAND_POINTS = [];
const C = {"bg":"#0c0a14","bgSoft":"#14111f","card":"#1a1626","border":"#2c2540","text":"#f2eefb","muted":"#9b93b3","mutedStrong":"#c9c4d6","accent":"#a855f7","accent2":"#ec4899","gold":"#fbbf24","green":"#34d399","acid":"#A3E635","acidHot":"#B6FF00","acidInk":"#141a08","amber":"#f59e0b","cyan":"#22d3ee","cyanInk":"#0b1e22","accentDeep":"#7c3aed"};

// REVERT LEVERS (spec §8.2), interpolated from the ONE TS const each. Read the
// exported consts in src/lib/mapHtml.ts for what each one restores when flipped.
// EVENTS_IN_SOURCE is read at applyAggMode's CALL SITE (aggModeJs itself stays a
// pure string), and by setEventPoints' pill gate from Task 5 on; DOCK_SATELLITES
// is declared here and consumed by the dock pass in Task 6, so the lever exists
// before the machinery it disables; EVENT_DOM_LIMIT is ALSO interpolated inside
// aggModeJs (that copy is the one the count gate reads). DEMAND_IN_SOURCE is
// read inside refreshClusterSource's own gig loop — the parent wave's I-1
// lesson, one kind over: a lever read at only SOME of its sites gives a state
// nobody has ever seen, and the arm reached for during an incident is the worst
// place to discover that. There is no second site: E5 cut the count-gate term
// and the GL gig layer, so the projection IS the whole arm.
const EVENTS_IN_SOURCE = true;
const DOCK_SATELLITES = true;
const EVENT_DOM_LIMIT = 120;
const DEMAND_IN_SOURCE = true;

// THE DOCK PASS'S CONSTANTS (spec §4.1's closing paragraph), interpolated from
// the ONE TS const each so the shell, the pure layout module and the tests read
// the same numbers (the AGG_IN coupling, ADR-0012). dockPass below is the only
// reader; dockLayout receives them as arguments rather than closing over them,
// which is what lets node:test run the layout with no shell around it.
// PIN_D / PIN_D_PRO / PIN_D_ACTIVE are NOT hoisted here on purpose: styleMarker
// already interpolates them inline, and a second spelling beside it is exactly
// the drift this file's own registry keeps warning about.
const DOCK_GROUND_M = 2940;
const DOCK_GAP_PX = 4;
const DOCK_OVERLAP_BUBBLES_PX = 8;
const DOT_R_PX = 10;
const DOT_BADGE_STANDOFF_PX = 6;

// One green (and one amber, one cyan): every translucent ring/glow derives
// from the SAME hex the solid parts use, so a token retune moves everything.
// The rings used to hand-type their rgba triples, and the green one had drifted
// to a DIFFERENT green from C.green entirely (tailwind green-500 vs the theme's
// emerald) — two greens on one pin, neither reachable from the token
// (MAP-COMPONENTS.md F-15). Written without the old literal on purpose: the
// tokens test asserts that triple appears NOWHERE in the document.
// CONTRACT: hex is a 6-digit '#rrggbb' (the shape every C token has). A short
// '#rgb', a named colour or an rgba() string yields NaN channels SILENTLY —
// pass tokens, never user data.
function rgbaOf(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}

// OUR OWN symbol layers, spelled ONCE (spec §3.3). retintMap's halo branch
// below skips every id in here; before the badges there was one of them and the
// escape was an id compare. Any symbol layer this shell adds must join the list
// in the same commit, or the next retint sticker-outlines its digits.
const OUR_SYMBOL_LAYERS = ['cluster-count', 'cluster-events', 'cluster-people', 'cluster-gigs', 'event-points'];

// THE BADGE AND EVENT-DOT IMAGES (spec §3.3/§3.6). Five discs, drawn on an
// offscreen canvas at map load and handed to MapLibre as ImageData.
//
// { pixelRatio: devicePixelRatio } is LOAD-BEARING: the canvas is sized in
// DEVICE pixels so the disc is crisp on retina, and an image drawn at device
// resolution but ADDED at the default ratio of 1 paints at double size. The
// DIGIT is a symbol text-field, never part of the image, so nothing here has to
// scale with a number.
//
// The approximate variants inset the disc by the ring width and stroke a DASHED
// ring at the rim: the gaps show the map through, which is the same "inferred
// coordinate, never a surveyed one's confident outline" treatment the DOM event
// pill wears. Fills come from the C tokens (C.cyan / C.accentDeep) and are never
// re-typed as hex — tests/map-shell-tokens.test.ts counts each layer hex EXACTLY
// once in the whole document.
function makeBadgeImages(map) {
  const dpr = window.devicePixelRatio || 1;
  const disc = (id, fill, r, dashed) => {
    const px = Math.max(2, Math.round(r * 2 * dpr));
    const cv = document.createElement('canvas');
    cv.width = px;
    cv.height = px;
    const ctx = cv.getContext('2d');
    if (!ctx) return; // no 2d context (a headless/blocked canvas): draw nothing rather than throw on load
    const c = px / 2;
    const ring = 2 * dpr; // the same 2px border weight the pills and bubbles wear
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.arc(c, c, dashed ? c - ring : c, 0, Math.PI * 2);
    ctx.fill();
    if (dashed) {
      ctx.strokeStyle = fill;
      ctx.lineWidth = ring;
      ctx.setLineDash([3 * dpr, 2.5 * dpr]);
      ctx.beginPath();
      ctx.arc(c, c, c - ring / 2, 0, Math.PI * 2);
      ctx.stroke();
    }
    map.addImage(id, ctx.getImageData(0, 0, px, px), { pixelRatio: dpr });
  };
  // THE ROUNDED SQUARE (demand-union E8). Same box as a disc, different shape:
  // the legend's own Open-gigs swatch is a rounded square, so on a mixed dot
  // wearing both shoulder badges the cyan events count and the amber gigs count
  // read apart by SHAPE and not by colour alone — which is what a colour-blind
  // viewer, or a viewer glancing at a 9px glyph, actually gets.
  //
  // The path is arcTo, NEVER roundRect: Safari 15 WebViews do not have
  // roundRect, and a missing method here throws inside the 'load' handler and
  // takes the whole map with it, not just this badge.
  //
  // No dashed/approximate variant, unlike the cyan disc: MapDemandPoint carries
  // no precision fact at all (a gig's coordinate is the poster's pick or a city
  // geocode, undistinguished by the time it reaches the host), so this badge
  // cannot know one — and a confident outline that means nothing is better than
  // a dashed one that implies a fact nobody measured.
  const square = (id, fill, r, radius) => {
    const px = Math.max(2, Math.round(r * 2 * dpr));
    const cv = document.createElement('canvas');
    cv.width = px;
    cv.height = px;
    const ctx = cv.getContext('2d');
    if (!ctx) return; // no 2d context (a headless/blocked canvas): draw nothing rather than throw on load
    const rad = radius * dpr; // the corner scales with everything else on this canvas
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.moveTo(rad, 0);
    ctx.lineTo(px - rad, 0);
    ctx.arcTo(px, 0, px, rad, rad);
    ctx.lineTo(px, px - rad);
    ctx.arcTo(px, px, px - rad, px, rad);
    ctx.lineTo(rad, px);
    ctx.arcTo(0, px, 0, px - rad, rad);
    ctx.lineTo(0, rad);
    ctx.arcTo(0, 0, rad, 0, rad);
    ctx.closePath();
    ctx.fill();
    map.addImage(id, ctx.getImageData(0, 0, px, px), { pixelRatio: dpr });
  };
  disc('gs-badge-cyan', C.cyan, 9, false);
  disc('gs-badge-cyan-approx', C.cyan, 9, true);
  disc('gs-badge-accent', C.accentDeep, 9, false);
  disc('gs-event-dot', C.cyan, 10, false);
  disc('gs-event-dot-approx', C.cyan, 10, true);
  square('gs-badge-amber', C.amber, 9, 3);
}

// Gozo's retintMap, night edition: repaint every positron layer to the
// Gigshot palette instead of swapping tile providers.
function retintMap(map) {
  const LAND = C.bg, LAND_ALT = C.bgSoft;
  // WATER used to be '#070510' — visually identical to LAND (C.bg) at a
  // glance, so zoomed out to continent/country scale (fill layers only, no
  // roads/buildings yet) the map read as a featureless void: no coastline,
  // no borders, nothing to anchor on. Now a clearly-distinct deep blue-black
  // so land vs. water reads immediately, while staying in the night palette.
  const WATER = '#0e1526', WATER_ALT = '#0a0f1c';
  const BUILDING = C.card, BUILDING_OUTLINE = C.border;
  const ROAD = '#211b31', ROAD_CASING = C.border, ROAD_MAJOR = '#352b4e';
  const TEXT = C.muted, TEXT_SOFT = '#6f6788', TEXT_HALO = C.bg;
  // Subtle but visible country-outline tone — the only other landmark visible
  // at low zoom besides the coastline, so a zoomed-out map reads as "a world"
  // rather than a void between coast and the first city label.
  const BOUNDARY = '#3a3354';
  for (const layer of map.getStyle().layers ?? []) {
    const id = layer.id.toLowerCase();
    if (layer.type === 'background') {
      map.setPaintProperty(layer.id, 'background-color', LAND);
    } else if (layer.type === 'fill') {
      if (id.includes('water')) {
        map.setPaintProperty(layer.id, 'fill-color', WATER);
      } else if (id.includes('building')) {
        map.setPaintProperty(layer.id, 'fill-color', BUILDING);
        map.setPaintProperty(layer.id, 'fill-outline-color', BUILDING_OUTLINE);
      } else if (id.includes('parking') || id.includes('pedestrian') || id.includes('transportation') || id.includes('aeroway')) {
        map.setPaintProperty(layer.id, 'fill-color', ROAD);
        map.setPaintProperty(layer.id, 'fill-outline-color', ROAD);
      } else if (id.includes('landuse') || id.includes('park') || id.includes('wood')) {
        map.setPaintProperty(layer.id, 'fill-color', LAND_ALT);
      } else if (id.includes('landcover') || id.includes('land')) {
        map.setPaintProperty(layer.id, 'fill-color', LAND);
      }
    } else if (layer.type === 'line') {
      if (id.includes('water')) {
        map.setPaintProperty(layer.id, 'line-color', WATER_ALT);
      } else if (id.includes('boundary') || id.includes('admin')) {
        // Country/admin outlines — the other landmark visible at continent
        // zoom besides the coastline. Left at the stylesheet default before,
        // these blended into the near-black fills; a subtle but visible tone
        // makes borders read without competing with roads/pins up close.
        map.setPaintProperty(layer.id, 'line-color', BOUNDARY);
      } else if (id.includes('highway') || id.includes('railway') || id.includes('road') || id.includes('tunnel') || id.includes('bridge') || id.includes('aeroway')) {
        const isCasing = id.includes('casing') || id.includes('outline');
        const isMajor = id.includes('motorway') || id.includes('trunk') || id.includes('primary') || id.includes('major');
        map.setPaintProperty(layer.id, 'line-color', isCasing ? ROAD_CASING : isMajor ? ROAD_MAJOR : ROAD);
      }
    } else if (layer.type === 'symbol') {
      // BASEMAP labels only. This branch halo-writes EVERY symbol layer in the
      // style, and OUR OWN symbol layers carry DELIBERATELY different treatments
      // (cluster-count's translucent rgbaOf(C.bg, 0.6) halo at 1.5; the badges'
      // and the event dot's dark ink with no halo at all, see
      // ensureClusterLayers). Today they survive only because retintMap happens
      // to run on 'load' before any point push has created them: an ordering
      // accident, not a rule. A later retint (a theme toggle, a style reload,
      // any re-run after points exist) would silently overwrite them with the
      // opaque basemap halo and every digit would gain a sticker outline.
      // Skip the whole SET by id so the invariant is enforced rather than
      // incidental — one list, declared above, that a new symbol layer joins.
      if (OUR_SYMBOL_LAYERS.includes(layer.id)) continue;
      const isMinor = id.includes('road') || id.includes('poi') || id.includes('housenumber');
      try {
        map.setPaintProperty(layer.id, 'text-color', isMinor ? TEXT_SOFT : TEXT);
        map.setPaintProperty(layer.id, 'text-halo-color', TEXT_HALO);
        map.setPaintProperty(layer.id, 'text-halo-width', 1.2);
      } catch (e) {}
    }
  }
}

// PRO ring: the gozo Partner treatment — slightly larger, a soft ring,
// never louder. Restraint is the point.
const PRO_RING = '0 0 0 3px rgba(251,191,36,0.35)';

// Travel (presence-window) markers are GREEN — "they're traveling HERE", as
// opposed to the accent (purple) HOME pin. Differentiated by colour AND a glyph
// (a ✈ corner badge) + a square-ish shape cue, never colour alone (a11y).
const TRAVEL = C.green;
const TRAVEL_RING = '0 0 0 3px ' + rgbaOf(C.green, 0.35);

// Identity accent per pin: DJ pins keep ACID GREEN on the map ONLY (founder
// call 2026-07-13, theme.ts mapDjAccent) — the app-wide acid retirement never
// applied to the map surface. Availability treatments (confirmed green square,
// gold PRO ring) are STATES, not identities, and take precedence.
function identColor(p) { return p.vertical === 'dj' ? C.acid : C.accent; }
// Active-pin glow, per vertical (was hardcoded purple) — derived from the same
// hex identColor/identGradient paint with, so there is one acid and one purple.
function identGlow(p) {
  return '0 4px 14px ' + (p.vertical === 'dj' ? rgbaOf(C.acid, 0.6) : rgbaOf(C.accent, 0.6));
}
// Active-pin face + popup CTA gradient, per vertical.
function identGradient(p) {
  return p.vertical === 'dj'
    ? 'linear-gradient(135deg, ' + C.acid + ', ' + C.acidHot + ')'
    : 'linear-gradient(135deg, ' + C.accent + ', ' + C.accent2 + ')';
}

// "Load as you zoom": the profile photo only paints onto the pin at/above this
// zoom. Far out (continent view) pins stay cheap emoji tiles and NO image is
// requested; as you zoom into a city the photos load for the handful on screen.
// Mirrored as the literal 6 in aggModeJs's cold-start branch (zoom < 6) —
// that string is evaluated standalone in tests/new Function and cannot read
// this const, so the two 6s are kept in sync by this comment pair only (same
// rationale as the DOM_MARKER_LIMIT/60 pair below).
const PHOTO_ZOOM = 6;

// styleMarker now takes the whole point so it can paint a photo OR the emoji.
// (Kept the name + (el, p, active) shape; every caller passes the point.)
function styleMarker(el, p, active) {
  // CONFIRMED-here = a presence window covers the queried date (availState), or,
  // for older callers, simply a via note. Green, distinct ring, and a slightly
  // rounded SQUARE (not a circle) — a shape cue so it reads as "confirmed" even
  // without colour. REACHABLE (home fallback) points keep the round accent
  // treatment, and are DIMMED to read as the softer "ask if they can travel".
  const confirmed = p.availState ? p.availState === 'confirmed' : !!p.via;
  const reachable = p.availState === 'reachable';
  // The three diameters are INTERPOLATED from map-dock-js.ts (PIN_D / PIN_D_PRO
  // / PIN_D_ACTIVE), not hand-typed here any more: the dock pass measures an
  // anchor with the same numbers this function paints it with, and two spellings
  // would place every satellite against a pin of the wrong size.
  const base = p.pro ? 38 : 34;
  const size = active ? base + 6 : base;
  // Do NOT set an inline CSS position here. MapLibre positions the marker root
  // via its .maplibregl-marker class (position:absolute) plus an inline
  // transform; an inline 'relative' overrides that class and drops every pin
  // back into DOCUMENT FLOW, so pins stack in a vertical column down the map
  // instead of sitting at their coordinates (the "map is completely off" bug,
  // present since cfffe5e). z-index still applies (the class makes the element
  // positioned), and the rings/photo are box-shadow/background on this same
  // element, so nothing here needs its own positioning context.
  // (This function body lives inside the shell template literal: no backticks
  // in comments here, they terminate the string and break build:shell.)
  el.style.width = size + 'px';
  el.style.height = size + 'px';
  // Shape cue: confirmed pins are rounded-squares, reachable/home pins are circles.
  el.style.borderRadius = confirmed ? '30%' : '50%';
  el.style.boxSizing = 'border-box';
  // Dim reachable (home-fallback) pins so confirmed pins read as the answer;
  // confirmed (or no availState) pins stay full strength.
  // Dim only when the host flagged it (a relative signal: reachable AND there's a
  // confirmed pin to contrast with) — never dim the whole map on the default view.
  el.style.opacity = p.dim ? '0.55' : '1';
  // Reachable/home pins wear the OWNER's identity accent (acid for DJ, purple
  // otherwise — identColor); confirmed pins keep the green availability
  // treatment, which outranks identity because it answers the date question.
  const borderColor = active ? C.text : confirmed ? TRAVEL : identColor(p);
  el.style.border = '2px solid ' + borderColor;
  const baseShadow = active
    ? (confirmed ? '0 4px 14px ' + rgbaOf(C.green, 0.6) : identGlow(p))
    : '0 2px 8px rgba(0,0,0,.5)';
  // Confirmed ring (green) takes precedence over the PRO ring so the "here on
  // your date" signal is never lost; reachable PRO pins keep the gold ring.
  const ring = confirmed && !active ? TRAVEL_RING : p.pro && !active ? PRO_RING : '';
  el.style.boxShadow = ring ? baseShadow + ', ' + ring : baseShadow;
  // Own gig pins are draggable → a grab cursor signals "move me"; everyone
  // else's keep the plain pointer.
  el.style.cursor = p.editable ? 'grab' : 'pointer';
  el.style.zIndex = active ? '10' : confirmed ? '3' : p.pro ? '2' : '1';
  // No inline transition here. The list moved to the .gs-supply CSS rule (see
  // the <style> block) because the seam's opacity crossfade has to share it: an
  // inline "transition" shorthand beats a class rule, so an inline list would
  // silently override the seam's fade and turn the crossfade into a hard cut.
  // Same move makes the reduced-motion override actually reachable.
  if (p.avatarUrl && map.getZoom() >= PHOTO_ZOOM) {
    // Photo face: the image fills the circle; no emoji, no gradient.
    el.textContent = '';
    el.style.background = C.card;
    el.style.backgroundImage = "url('" + String(p.avatarUrl).replace(/'/g, '%27') + "')";
    el.style.backgroundSize = 'cover';
    el.style.backgroundPosition = 'center';
  } else {
    // Emoji face (default, and the fallback when there's no photo or we're zoomed out).
    el.style.backgroundImage = 'none';
    el.style.background = active ? identGradient(p) : C.card;
    el.style.display = 'flex';
    el.style.alignItems = 'center';
    el.style.justifyContent = 'center';
    el.style.fontSize = Math.round(size * 0.5) + 'px';
    el.textContent = p.emoji;
  }
  // ✓ corner badge LAST — the face paths above set el.textContent (which would
  // drop a child badge), so the badge is (re)attached after the face is painted.
  // The non-colour glyph cue for confirmed markers; removed when reachable/home.
  let badge = el.querySelector('.gigshot-travel-badge');
  if (confirmed) {
    if (!badge) {
      badge = document.createElement('div');
      badge.className = 'gigshot-travel-badge';
      badge.textContent = '✓';
      el.appendChild(badge);
    }
    const bs = Math.max(14, Math.round(size * 0.46));
    badge.style.cssText =
      'position:absolute;top:-6px;right:-6px;width:' + bs + 'px;height:' + bs + 'px;' +
      'border-radius:50%;background:' + TRAVEL + ';color:#04210f;font-size:' + Math.round(bs * 0.62) + 'px;' +
      'line-height:' + bs + 'px;text-align:center;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.5);' +
      'pointer-events:none;z-index:1;';
  } else if (badge) {
    badge.remove();
  }
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

// Bridge that works in both hosts: React Native WebView (postMessage to RN)
// and a plain iframe on web (postMessage to the parent window).
window.notify = function (payload) {
  const json = JSON.stringify(payload);
  // Lock the target origin: the shell is served same-origin as the app, so the
  // parent is always our own origin. '*' would let any embedder read the
  // payload (incl. a member's home coordinates) if the frame were ever embedded
  // cross-origin. (Native WebView has no origin concept — RN bridge as-is.)
  if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(json);
  else window.parent.postMessage(json, window.location.origin);
};

const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/positron',
  center: [6.5, 49.5],
  zoom: 3.4,
  attributionControl: false,
  // fadeDuration 0: kill MapLibre's default 300ms symbol fade-in. The cluster
  // count labels are a symbol layer; with the default fade they re-fade-in on
  // every source.setData() (a 'Search as I move' re-query), making the cluster
  // numbers blink. 0 = labels pop instead — snappier, no flicker. (mapbox-gl-js #5716)
  fadeDuration: 0,
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');

// All our camera moves go through pmove (flyToPoint/fitPoints/focusCity/cluster
// zoom). It used to set a "programmatic" flag so the removed viewport-search
// could tell our own moves from a human pan; with that feature gone it's a plain
// passthrough, kept so its many callers don't have to change.
function pmove(fn) { fn(); }

// City-scale camera floor, single-sourced from CITY_ZOOM in src/lib/mapHtml.ts
// (see its doc comment for the metres-per-pixel arithmetic behind 12.5).
const CITY_ZOOM = 12.5;

// A caller-supplied zoom is HONOURED, not clamped. An earlier pass floor-clamped
// it to CITY_ZOOM on the premise that "every caller asks for 11-12"; that premise
// is false — MapSearchPill's creator-result fly-to asks for 10 deliberately, and
// selectMyTourCity passes the gazetteer's per-place zoom. Silently rewriting an
// explicit caller intent to make the de-overlap more visible is the wrong layer:
// if near-me should land tighter, that belongs at its call site (useMapCamera),
// where it can be reviewed against the "empty-looking first frame for suburb
// users" trade, not hidden in a global override. CITY_ZOOM remains the DEFAULT
// when a caller supplies no zoom at all.
window.flyToPoint = function (lng, lat, zoom) {
  const want = (typeof zoom === 'number' && zoom > 0) ? zoom : CITY_ZOOM;
  pmove(() => map.flyTo({ center: [lng, lat], zoom: want, duration: 900 }));
};

// "Show my home + travels" fit: frame an arbitrary set of [lng,lat] pairs.
// maxZoom 9 keeps a single-point or tight cluster from rocketing to street
// level; setPadding(0) first sidesteps the known maplibre bug where successive
// fitBounds padding values accumulate (each call would otherwise add to the
// last, slowly squeezing the framed area). Single point → a plain flyTo.
window.fitPoints = function (coords, zoom) {
  if (!coords || !coords.length) return;
  if (coords.length === 1) {
    pmove(() => map.flyTo({ center: coords[0], zoom: zoom || 9, duration: 900 }));
    return;
  }
  const b = new maplibregl.LngLatBounds();
  for (const c of coords) b.extend(c);
  pmove(() => {
    map.setPadding(0);
    map.fitBounds(b, { padding: 70, maxZoom: zoom || 9, duration: 900 });
  });
};

// Location picker: a single DRAGGABLE marker the member positions to set their
// own home point (for a place the city dataset doesn't cover). Drag the marker
// OR click the map to move it; both report {type:'picked', lng, lat} so the host
// can save it. Switches the shell out of browse mode (no creator pins/clusters).
let pickerMarker = null;
window.enablePicker = function (lng, lat) {
  clearMarkers();
  // Clear ALL THREE arrays of the union, then refresh, so the arrays and the
  // signature agree — the picker owns this canvas and shows no supply at all.
  // The guard is DEFENSIVE, not load-bearing: the picker document DOES create
  // the source on load, because its own map.on('load') calls setPoints before it
  // notifies ready, so the layers exist there too, over an empty source, and
  // applyAggMode's pickerMarker bail keeps them inert. Clearing POINTS is NEW
  // (this used to leave it, and fitAll/focusCity read it) and is inert because
  // the picker never fits — stated rather than hidden. EVENT_POINTS and
  // DEMAND_POINTS are already empty here: the picker is a separate shell document
  // (LocationPicker.web.tsx) that never receives an event or demand push.
  if (map.getSource('creators')) {
    POINTS = [];
    EVENT_POINTS = [];
    DEMAND_POINTS = [];
    refreshClusterSource();
  }
  const start = (typeof lng === 'number' && typeof lat === 'number') ? [lng, lat] : map.getCenter().toArray();
  if (pickerMarker) pickerMarker.remove();
  const el = document.createElement('div');
  el.textContent = '📍';
  el.style.fontSize = '36px';
  el.style.lineHeight = '36px';
  el.style.cursor = 'grab';
  // Draggable affordance: a soft accent ring + drop shadow so the pin reads as a
  // movable handle, not a static label. (Cheap text-shadow/filter — no extra DOM.)
  el.style.filter = 'drop-shadow(0 3px 6px rgba(0,0,0,.55))';
  el.style.textShadow = '0 0 0 ' + C.accent + ', 0 0 14px rgba(168,85,247,.45)';
  el.setAttribute('aria-label', 'Your location. Drag to move.');
  pickerMarker = new maplibregl.Marker({ element: el, draggable: true, anchor: 'bottom' })
    .setLngLat(start)
    .addTo(map);
  pickerMarker.on('dragstart', () => { el.style.cursor = 'grabbing'; });
  pickerMarker.on('dragend', () => {
    el.style.cursor = 'grab';
    const ll = pickerMarker.getLngLat();
    window.notify({ type: 'picked', lng: ll.lng, lat: ll.lat });
  });
  // Existing-pin / search default: open ON the saved point at a street-legible
  // zoom (14), never the coarse continent default. A bare enablePicker() with no
  // coords still falls back to the current center (e.g. the gig map's last view).
  const openZoom = (typeof lng === 'number' && typeof lat === 'number') ? 14 : 11;
  pmove(() => map.flyTo({ center: start, zoom: openZoom, duration: 600 }));
  window.notify({ type: 'picked', lng: start[0], lat: start[1] }); // report the starting point
};

// Exit picker mode: drop the draggable pin so the host can restore the discovery
// map (it re-pushes setPoints afterwards). No-op when the picker isn't active.
window.disablePicker = function () {
  if (pickerMarker) { pickerMarker.remove(); pickerMarker = null; }
  // The seam no-ops for as long as the picker owns the canvas, so aggMode and
  // the paint state are stale BY DEFINITION on exit. Re-evaluate here instead of
  // waiting for the host's re-push or the next zoomend (pickerMarker is already
  // null above, so applyAggMode's own guard lets this call through).
  applyAggMode();
};

// Move the picker pin programmatically — the search-box + "use my location"
// path. flyToPoint alone only pans the CAMERA; it does NOT move the draggable
// marker, so the pin would be left behind. setPickerPoint moves the marker,
// flies to it, and emits the SAME {type:'picked'} the drag/click emit, so the
// host saves it identically. No-op when the picker isn't enabled (the shell is
// shared with the discovery map — a stray call there must not paint a pin).
window.setPickerPoint = function (lng, lat, zoom) {
  if (!pickerMarker) return; // picker not active — ignore (shared-shell guard)
  if (typeof lng !== 'number' || typeof lat !== 'number') return;
  pickerMarker.setLngLat([lng, lat]);
  pmove(() => map.flyTo({ center: [lng, lat], zoom: zoom || 13, duration: 700 }));
  window.notify({ type: 'picked', lng: lng, lat: lat });
};

// Single long-lived map instance: periods swap markers via setPoints —
// remounting MapLibre (new WebGL context per period) stalls its render loop.
let markers = [];
// Demand-anchored context layer (Phase 3): OPEN REQUESTS (unmet demand). A
// SEPARATE, simple, non-clustered marker set — NEVER routed through setPoints /
// syncMarkers / the cluster source. Kept distinct so the demand backdrop and the
// supply pins can never interfere with each other.
let demandMarkers = [];
// Event layer: upcoming EVENTS (event_supply, counts only). A THIRD marker set,
// kept as separate from setPoints/syncMarkers/the cluster source as the demand
// badges are, for the same reason: three layers that answer three different
// questions (who is bookable / who is hiring / what is happening) must never be
// able to interfere with each other's rendering.
let eventMarkers = [];
// id -> marker, so setPoints can DIFF (keep unchanged pins) instead of wiping +
// rebuilding every call — the latter made pins jump/flicker during "search as I
// move" (every settle tore down and recreated all markers).
let markerById = {};
// The single creator popup that may be open. Opening another (a different marker,
// or a clustered point) closes this one first, so popups never overlay/stack.
let openPopup = null;
// Click-outside-to-close (user control & freedom): a click on the map BACKGROUND
// dismisses the open card. popupJustOpened guards the very click that opened it —
// in this shell the opening click also reaches map.on('click') (same tick), and
// closing there would re-create the old "flash" bug. markPopupOpen tracks the
// open popup AND arms the guard, cleared on the next tick so a LATER background
// click closes. Every popup (marker / cluster point / demand) routes through it.
let popupJustOpened = false;
function markPopupOpen(p) {
  if (openPopup && openPopup !== p) openPopup.remove();
  openPopup = p;
  popupJustOpened = true;
  setTimeout(function () { popupJustOpened = false; }, 0);
}
// Last UNION signature pushed to the cluster source (creators AND events) — see
// refreshClusterSource, which owns both the spelling and the short-circuit.
let lastClusterSig = null;

function clearMarkers() {
  for (const m of markers) m.remove();
  markers = [];
  markerById = {};
}

function popupCard(p) {
  const proBadge = p.pro
    ? '<span style="font-size:10px;font-weight:700;color:' + C.gold + ';border:1px solid rgba(251,191,36,.4);border-radius:99px;padding:1px 7px;margin-left:6px">PRO</span>'
    : '';
  // The role line + CTA follow the pin's vertical (subject partition). A DJ pin
  // gets the ACID gradient, so its CTA ink is C.acidInk — the accent's DARK
  // counterpart. White ink on lime measured ~1.5:1 (MAP-COMPONENTS.md F-05);
  // everyone else keeps white on the purple gradient, which is fine.
  const ident = identColor(p);
  const ctaInk = p.vertical === 'dj' ? C.acidInk : '#fff';
  return (
    '<div style="width:225px;padding:12px 14px;font-family:system-ui,sans-serif">' +
      '<div style="font-size:16px;font-weight:800;color:' + C.text + '">' + esc(p.name) + proBadge + '</div>' +
      '<div style="font-size:12px;font-weight:600;color:' + ident + ';margin:2px 0 4px">' + esc(p.role) + ' · ' + esc(p.city) + '</div>' +
      // The ★ rating ALONE (Task 3b / D5): the popup used to append a
      // hand-rolled "from €X" that could contradict the rail card one tap
      // away. Pins speak availability; prices live on surfaces that run
      // through service-price.ts. (NO backticks in this comment on purpose —
      // this whole shell is ONE template literal, the AGENTS.md scar.)
      '<div style="font-size:13px;color:' + C.mutedStrong + '">' + esc(p.ratingLabel) + '</div>' +
      // Last-active (0040): "● Active Xh ago" — already formatted by the host.
      (p.lastActiveLabel ? '<div style="font-size:11px;font-weight:600;color:' + C.accent2 + ';margin-top:4px">● Active ' + esc(p.lastActiveLabel) + '</div>' : '') +
      // Availability status line (gold/accent), styled like the old via line.
      // availLabel supersedes via — it frames the pin as the answer to who can
      // do my gig on this date (confirmed here vs reachable/ask-to-travel).
      (p.availLabel
        ? '<div style="font-size:11px;font-weight:600;color:' + C.gold + ';margin-top:4px">' + esc(p.availLabel) + '</div>'
        : p.via
          ? '<div style="font-size:11px;font-weight:600;color:' + C.gold + ';margin-top:4px">✈ ' + esc(p.via) + '</div>'
          : '') +
      // No inline onclick: the id is bound via a DOM closure on popup open (see
      // makeMarker) — an HTML-attribute + JS-string double context is the wrong
      // place for entity escaping (the demand pin's gs-respond lesson applies
      // identically here; p.id is a server UUID today, but the closure removes
      // the footgun regardless of the id source).
      '<button class="gs-view-profile" ' +
        'style="margin-top:10px;width:100%;padding:9px 0;border:none;border-radius:99px;font-weight:700;font-size:13px;color:' + ctaInk + ';cursor:pointer;background:' + identGradient(p) + '">View profile</button>' +
    '</div>'
  );
}

// THE EVENT CARD, ONE SPELLING (spec §3.6). Both event surfaces render this:
// the DOM pill's popup (setEventPoints) and the GL event dot's popup past the
// DOM limit (the 'event-points' click handler). Two copies is how a pill and a
// dot end up disagreeing about the same event — the popupCard precedent, one
// layer over.
//
// The argument is EITHER a host EventPin or a GL feature's properties. Those
// differ in exactly one way that matters: the tile encoder DROPS null and
// undefined properties, so whenLine/crewBand ARRIVE MISSING rather than null on
// the GL path. Every optional line is therefore truthiness-gated, never
// concatenated — a bare concat prints the word 'undefined' on the card.
//
// DATES ARE THE PAGE'S OWN STRINGS (D5, ADR-0030's two facts): whenLine is the
// event's SCHEDULE, crewBand is who is on site and when, and this shell composes
// neither. It used to build a fromDate-toDate range here, which is the /scene
// scar — one surface rendering a second, locally-composed date line that could
// disagree with the page it links to.
function eventPopupHtml(ev) {
  const going = typeof ev.goingCount === 'number' ? ev.goingCount : 0;
  // precise === false means the coordinate is area-scale, not a surveyed point
  // (see the pill's own note in setEventPoints). The 'near' line below is shown
  // ONLY then: on a precise pin it would claim the event is somewhere it is not.
  const approx = ev.precise === false;
  return (
    '<div style="width:210px;padding:12px 14px;font-family:system-ui,sans-serif">' +
      '<div style="font-size:13px;font-weight:800;color:' + C.cyan + '">🎪 ' + esc(ev.name || 'Event') + '</div>' +
      // Zero-crew face (Z3): the count line becomes the honest story line.
      // esc() on the count arm only — 'No crew here yet' is a literal.
      '<div style="font-size:12px;color:' + C.mutedStrong + ';margin-top:6px">' + (going ? esc(going) + ' going' : 'No crew here yet') + '</div>' +
      (ev.gigCount ? '<div style="font-size:12px;color:' + C.mutedStrong + ';margin-top:2px">' + esc(ev.gigCount) + ' open ' + (ev.gigCount === 1 ? 'gig' : 'gigs') + '</div>' : '') +
      // The event's OWN schedule line, or the honest-absence face. The two are
      // mutually exclusive upstream (placeViewModel sets datesUnconfirmed only
      // when there is no renderable schedule), and a real date wins if they ever
      // both arrive: a date is never less true than 'unconfirmed'.
      (ev.whenLine
        ? '<div style="font-size:11px;color:' + C.muted + ';margin-top:2px">' + esc(ev.whenLine) + '</div>'
        : ev.datesUnconfirmed
          ? '<div style="font-size:11px;color:' + C.muted + ';margin-top:2px">Dates unconfirmed</div>'
          : '') +
      // A SEPARATE line, never merged with the one above: the crew band is when
      // people are ON SITE, which is a different fact from when the event runs.
      (ev.crewBand ? '<div style="font-size:11px;color:' + C.muted + ';margin-top:2px">' + esc(ev.crewBand) + '</div>' : '') +
      (approx && ev.nearCity
        ? '<div style="font-size:11px;color:' + C.muted + ';margin-top:2px">near ' + esc(ev.nearCity) + '</div>'
        : '') +
      // The CTA wears the event-pill family treatment (translucent cyan + cyan
      // border + near-white ink), NOT solid cyan with dark ink: the app-wide
      // button rule is white text (ui.tsx btnText), and white only reads on a
      // deep fill — solid C.cyan is too light for it, which is how this button
      // ended up the one dark-ink outlier (founder call, 2026-08-19: white like
      // every other button). Spell the hue as C.cyan only: the token test counts
      // the raw hex ONCE per document. Zero-crew CTA (Z3): same class, same
      // notify route — only the label changes, because the place page's
      // zero-crew face already offers I'm-available and 'See who's going' over
      // nobody would be a lie. NO inline onclick: every caller binds the class
      // through a DOM closure after the popup is attached.
      '<button class="gs-event-going" ' +
        'style="margin-top:10px;width:100%;padding:8px;border:2px solid ' + C.cyan + ';border-radius:8px;cursor:pointer;' +
        'background:' + rgbaOf(C.cyan, 0.22) + ';color:#e6fbff;font-weight:800;font-size:13px">' + (going ? 'See who’s going' : 'Be the first') + '</button>' +
    '</div>'
  );
}

// DOM emoji markers below this count (the expressive path); MapLibre's
// built-in GeoJSON clustering above it (the 100k path — thousands of points
// stay smooth because the GPU does the work, not the DOM). Mirrored as a
// literal 60 inside aggModeJs's count gate (see that doc comment) — the mode
// machine is evaluated standalone in tests/new Function and cannot read this
// shell-scope const, so the two literals are kept in sync by this comment pair.
const DOM_MARKER_LIMIT = 60;

// Build ONE marker for a point (used by the diff below). Registered in both the
// markers array (zoom-repaint iterates it) and markerById (the diff key).
function makeMarker(p) {
  const el = document.createElement('div');
  el.setAttribute('aria-label', p.name);
  // The seam fades this class (spec §2) and owns its transition list — see the
  // .gs-supply rules in the <style> block. Set BEFORE styleMarker so the very
  // first paint already has the transitions attached.
  el.classList.add('gs-supply');
  styleMarker(el, p, false);

  // closeOnClick:false is deliberate. MapLibre opens this popup via the map
  // click that the marker bubbles up (NOT a separate element listener — so we
  // must NOT stopPropagation, or it never opens). A default closeOnClick would
  // let that very opening click also close it → the "flash for a millisecond"
  // bug. With it off, the popup stays; our pick handler (below) separately
  // ignores clicks that land on a marker, so the map doesn't re-render and
  // clear the pin. Clicking another marker / the ✕-less card toggles it.
  const cardHtml = popupCard(p);
  const popup = new maplibregl.Popup({ offset: 22, closeButton: false, closeOnClick: false, maxWidth: '250px', className: 'gigshot-popup' })
    .setHTML(cardHtml);
  // Seed the rendered-card cache that the syncMarkers repaint diffs against.
  // Without the seed the first comparison is undefined-vs-fresh, which always
  // reads as a change and forces one needless setHTML — and with it one focus
  // steal (see the repaint's WHY note).
  popup._gsHtml = cardHtml;
  popup.on('open', () => {
    markPopupOpen(popup);
    // Restyle from the CURRENT payload, never the construction-time p (F-01).
    // syncMarkers KEEPS this marker across pushes and repaints it in place, so a
    // closure over p would repaint the pin back to how it looked when first drawn
    // the moment its card opens — silently undoing a WHEN-scope flip or a photo
    // that hydrated later. m._gigshotPoint is the live payload (the same read the
    // zoomend repaint and dragend already do); the || p fallback covers the very
    // first open. Referencing m before its declaration below is safe: these
    // handlers only ever run on user interaction, long after construction.
    const cur = m._gigshotPoint || p;
    styleMarker(el, cur, true);
    // Bind View-profile via a closure (p.id captured) — mirrors the demand pin's
    // gs-respond binding; never interpolate an id into an onclick string. Capturing
    // the id stays correct even though capturing the payload did not: id is the
    // diff KEY, so a kept marker keeps its id by definition.
    const pel = popup.getElement();
    const btn = pel && pel.querySelector('.gs-view-profile');
    if (btn) btn.onclick = () => window.notify({ type: 'creator', id: p.id });
  });
  popup.on('close', () => {
    if (openPopup === popup) openPopup = null;
    // Same live-payload read as 'open' — closing a card must not resurrect the
    // construction-time style either.
    const cur = m._gigshotPoint || p;
    styleMarker(el, cur, false);
  });

  // Own gig pins are draggable so the provider repositions them straight from
  // the map (the "move my pins" gesture). dragend reports the window + new coords
  // to the host, which persists it via updatePresenceWindow. A click still opens
  // the popup — maplibre only fires dragend after a real drag, so a tap never
  // moves the pin by accident.
  const m = new maplibregl.Marker({ element: el, draggable: !!p.editable }).setLngLat([p.lng, p.lat]).setPopup(popup).addTo(map);
  if (p.editable) {
    el.setAttribute('title', 'Drag to move your gig');
    m.on('dragstart', () => {
      el.style.cursor = 'grabbing';
      if (openPopup) openPopup.remove(); // don't drag a pin with its card hanging open
    });
    m.on('dragend', () => {
      el.style.cursor = 'grab';
      const ll = m.getLngLat();
      const lp = m._gigshotPoint || p;
      window.notify({ type: 'window-moved', key: lp.windowKey, lng: ll.lng, lat: ll.lat });
    });
  }
  m._gigshotPoint = p; // for the zoom repaint
  markers.push(m);
  markerById[p.id] = m;
  return m;
}

// DIFF the on-map markers to the new set: keep the markers whose id persists
// (no flicker — they stay exactly where they are), move any that changed coords,
// add the genuinely-new, remove the gone. This is what stops the "pins jump all
// over" during "search as I move" — only the delta touches the DOM.
function syncMarkers(pts) {
  const want = {};
  for (const p of pts) want[p.id] = p;
  for (let i = markers.length - 1; i >= 0; i--) {
    const m = markers[i];
    const id = m._gigshotPoint && m._gigshotPoint.id;
    if (!want[id]) {
      if (openPopup && m.getPopup && m.getPopup() === openPopup) openPopup = null;
      m.remove();
      markers.splice(i, 1);
      delete markerById[id];
    }
  }
  for (const p of pts) {
    const existing = markerById[p.id];
    if (existing) {
      const lp = existing._gigshotPoint;
      // Draggability is fixed at construction, so a pin that becomes (or stops
      // being) the viewer's own editable gig must be REBUILT, not just moved —
      // otherwise it'd keep the wrong draggable flag.
      if (!!lp.editable !== !!p.editable) {
        if (openPopup && existing.getPopup && existing.getPopup() === openPopup) openPopup = null;
        existing.remove();
        const idx = markers.indexOf(existing);
        if (idx >= 0) markers.splice(idx, 1);
        delete markerById[p.id];
        makeMarker(p);
        continue;
      }
      // Reposition when the payload moved — OR when the marker's LIVE position
      // has drifted off the payload. A drag moves the DOM node without touching
      // _gigshotPoint, so after a REFUSED save (pin-move-truth) the host
      // re-pushes byte-identical data: lp equals p, yet the marker still sits
      // where the drag DROPPED it. Comparing lp alone would skip setLngLat and
      // strand that ghost pin; the live check snaps it home.
      const live = existing.getLngLat();
      if (lp.lng !== p.lng || lp.lat !== p.lat || live.lng !== p.lng || live.lat !== p.lat) {
        existing.setLngLat([p.lng, p.lat]);
      }
      // Repaint on ANY payload change (F-01): the diff keeps the marker alive
      // to avoid flicker, but a kept marker must still track its data — photos
      // arriving after listCreators hydrates, dim/availState flips on a WHEN
      // change, and the popup's last-active line all land here. The host's
      // signature guard (useMapFrame) already ensures we only receive pushes
      // that changed SOMETHING, so the stringify cost is bounded and rare.
      const changed = JSON.stringify(lp) !== JSON.stringify(p);
      existing._gigshotPoint = p;
      if (changed) {
        const pop = existing.getPopup && existing.getPopup();
        const isOpen = !!(pop && pop.isOpen && pop.isOpen());
        styleMarker(existing.getElement(), p, isOpen);
        // The accessible name is set ONCE at construction, so a kept marker would
        // keep announcing the old name while its card already shows the new one.
        existing.getElement().setAttribute('aria-label', p.name);
        if (pop) {
          // Only touch the popup DOM when the RENDERED CARD actually differs.
          // setHTML routes through maplibre's setDOMContent, which ends in
          // _focusFirstElement (focusAfterOpen defaults to true): it moves
          // DOCUMENT focus to the first focusable node in the card — our
          // .gs-view-profile button. On web the map is an IFRAME inside the host
          // page, so a needless refresh yanks the caret out of whatever the user
          // is typing in (the search box). Scatter jitter alone moves a
          // coordinate enough to set the change flag, so a byte-identical card
          // is the COMMON case here, not the rare one — skipping it is both the
          // focus fix and the churn fix.
          const html = popupCard(p);
          if (pop._gsHtml !== html) {
            // Belt and braces for the genuinely-changed case: remember who had
            // focus and hand it back if the refresh took it. (A CLOSED popup has
            // no _container, so maplibre's focus grab is open-only — this costs
            // nothing on the closed path.)
            const active = document.activeElement;
            pop.setHTML(html);
            pop._gsHtml = html;
            // A CLOSED popup rebinds its CTA in its own 'open' handler; an OPEN
            // one just had its DOM replaced, so rebind now.
            if (isOpen) {
              const pel = pop.getElement();
              const btn = pel && pel.querySelector('.gs-view-profile');
              if (btn) btn.onclick = () => window.notify({ type: 'creator', id: p.id });
            }
            if (active && active !== document.activeElement && active.focus) active.focus();
          }
        }
      }
    } else {
      makeMarker(p);
    }
  }
}

// "Load as you zoom": when crossing the PHOTO_ZOOM threshold, repaint the DOM
// markers so photos appear (or drop back to emoji on zoom-out). Only the handful
// of DOM markers (<=60) ever carry photos; the GL cluster path has none.
let lastPhotoMode = null;
map.on('zoomend', () => {
  const photoMode = map.getZoom() >= PHOTO_ZOOM;
  if (photoMode === lastPhotoMode) return; // only repaint when the threshold is crossed
  lastPhotoMode = photoMode;
  for (const m of markers) {
    const p = m._gigshotPoint;
    if (p) styleMarker(m.getElement(), p, m.getPopup() && m.getPopup().isOpen());
  }
});

// Reduced motion, the SHELL-GLOBAL preference. Two-way on purpose, exactly like
// the .gs-pulse guard: the @media query in the <style> block covers the
// browser/OS preference, and NATIVE HAS NO MEDIA QUERY AT ALL, so the host's own
// flag (threaded through setDemandPoints) is the only guard there. Mirrored onto
// the container as .gs-rm, which the CSS keys off. ONE preference, read by both
// consumers: the seam fade and the demand beacon pulse.
let reduceMotionFlag = false;
function setReduceMotion(on) {
  reduceMotionFlag = !!on;
  map.getContainer().classList.toggle('gs-rm', reduceMotionFlag);
}

// F3 (spec §2.1): the DISCRETE half of the seam, beside the photo-mode latch
// above and built on the same pattern (own latch, own listener).
//
// It owns BOTH halves of the handover that a shader cannot decide for itself:
// which side ACCEPTS TAPS (this flag plus the .gs-agg-bubbles class), and which
// of TWO paint states the GL layers rest in (below). It flips at two separated
// thresholds (hysteresis, inside aggModeFor) so pinch jitter across z6 can never
// flap the layers, and only on zoomend so a mid-gesture flick never swaps tap
// targets under the finger. It never touches the camera and never touches an
// open popup: a card opened from a pin survives the seam (spec §2.6).
let aggMode = null;
// Which of the two paint states the GL layers currently CARRY. They are BORN
// visible (ensureClusterLayers' addLayer paint values ARE the visible numbers
// below), so 'visible' is the honest initial value, and this is a latch: a
// zoomend storm must not re-set the seam's WHOLE identical paint set per
// gesture.
// CORRECTED 2026-09-06 (demand-union): this line said "five identical paint
// properties" and the state description below said "the other four" — the
// parent wave's numbers, already stale at nine and now eleven, while the body
// 60 lines down said "eleven properties now, not five". No count is restated
// here on purpose: tests/map-shell-agg.test.ts's allow-list over the seam's
// setPaintProperty calls is the answer that cannot rot, and it is what forces a
// twelfth property to be argued for.
//   'visible' bubbles, by zoom OR by count. 0.25 on the clusters fill (the value
//             the bubbles always had) and 1 on every other property in the
//             set, at EVERY zoom —
//             a count-forced >DOM_MARKER_LIMIT set needs them visible at street
//             zoom too, since they are the only layers able to draw it.
//   'hidden'  pins mode. Flat 0.
let aggPaintApplied = 'visible';
function applyAggMode() {
  if (pickerMarker) return; // the picker owns this shell instance's canvas
  // The EVENTS_IN_SOURCE lever lives HERE, at the call site, not inside
  // aggModeJs: that string stays pure (it is new Function'd standalone in the
  // tests), so switching the union off has to make the event term inert by
  // passing 0 rather than by editing the machine.
  const next = aggModeFor(aggMode, map.getZoom(), POINTS.length, EVENTS_IN_SOURCE ? EVENT_POINTS.length : 0);
  if (next !== aggMode) {
    aggMode = next;
    map.getContainer().classList.toggle('gs-agg-bubbles', aggMode === 'bubbles');
  }
  // The paint is a pure function of the MODE — no second reading of the count
  // gate here. aggModeFor already composes it (> DOM_MARKER_LIMIT means bubbles
  // at any zoom), and both bubbles cases now paint the same values, so there is
  // nothing left for a re-derivation to decide. One owner, one spelling.
  const paintState = next === 'pins' ? 'hidden' : 'visible';
  if (!map.getSource('creators')) return; // no layers yet: ensureClusterLayers re-runs this the moment it makes them
  if (paintState === aggPaintApplied) return;
  aggPaintApplied = paintState;
  // SETTLE-CROSSFADE, and these two flat numbers are the whole of it. A
  // zoom-interpolated opacity band was implemented here first
  // (['interpolate', ['linear'], ['zoom'], AGG_IN, 1, 6.3, 0], spec §2's
  // in-gesture crossfade) and REPLACED. Do not reintroduce it; two findings
  // killed it (Task 3 re-review):
  //   1. AT REST it was numerically INERT. Anchored at AGG_IN it evaluates to
  //      its LOW stop (1 / 0.25) at every zoom the mode still calls 'bubbles'
  //      (<= 6.14), and above AGG_IN the mode is 'pins', where this function
  //      paints a flat 0 regardless. So wherever the band actually applied it
  //      EQUALLED the flat values — identical resting pixels, more machinery.
  //   2. MID-GESTURE it was actively harmful. Between 6.15 and 6.3 it faded the
  //      bubbles out while the DOM pins are still hidden (they only appear on
  //      zoomend), so a continuous gesture that DWELLS in that window shows an
  //      EMPTY map. Desktop wheel-zoom is the worst case: a slow spin holds it
  //      the whole way. A blank supply window is the one thing the seam exists
  //      to prevent.
  // The crossfade instead happens AT SETTLE: setPaintProperty eases through
  // maplibre's default paint transition (~300ms) against the DOM pins' 220ms
  // .gs-supply CSS fade — symmetric in both directions, and at no instant is
  // neither side drawn.
  // 0.25: the bubbles wear the EVENT-pill treatment (founder call 2026-07-29)
  // — translucent accent fill behind a solid accent border, so the map reads
  // through them and the family resemblance with the cyan event pills is
  // explicit. Twinned with the birth paint on the 'clusters' layer below.
  const fill = paintState === 'hidden' ? 0 : 0.25;
  const rest = paintState === 'hidden' ? 0 : 1;
  map.setPaintProperty('clusters', 'circle-opacity', fill);
  map.setPaintProperty('clusters', 'circle-stroke-opacity', rest);
  map.setPaintProperty('cluster-count', 'text-opacity', rest);
  // The dots share the family fill (translucent) and a full-strength border —
  // same split as the clusters above and the event pills.
  map.setPaintProperty('points', 'circle-opacity', fill);
  map.setPaintProperty('points', 'circle-stroke-opacity', rest);
  // THE BADGES JOIN THE PAIR (spec §3.3, demand-union §2.3): eleven properties
  // now, not five. A badge
  // is drawn on a bubble, so it must leave with it — and it must leave through
  // the SAME paint transition, or the digit outlives the circle it annotates for
  // ~300ms and floats over the DOM pins. Both halves (glyph and digit) move
  // together for the same reason cluster-count's text does, and the amber gigs
  // badge is a badge like the other two.
  //
  // 'event-points' is DELIBERATELY not here: past the DOM limit it is the only
  // visible form an event has, at EVERY zoom, so the mode must not erase it.
  // Its latch is setEventGl, below.
  map.setPaintProperty('cluster-events', 'icon-opacity', rest);
  map.setPaintProperty('cluster-events', 'text-opacity', rest);
  map.setPaintProperty('cluster-people', 'icon-opacity', rest);
  map.setPaintProperty('cluster-people', 'text-opacity', rest);
  map.setPaintProperty('cluster-gigs', 'icon-opacity', rest);
  map.setPaintProperty('cluster-gigs', 'text-opacity', rest);
}
map.on('zoomend', applyAggMode);

// FOLDING (spec §3.4): below the seam an event is represented exactly ONCE. A
// pill whose event is INSIDE a cluster hides, because that cluster's own cyan
// badge already draws it; it comes back when the cluster does not.
//
// Display only. eventPoints, drawnEventKeys, tallyLegend and the rail are all
// host-side and read the same arrays as before, so a folded event is still
// "drawn" (it IS counted on the map) and its linked gig still folds into
// gigCount. Nothing here touches a marker, a coordinate, or an open popup: a
// card opened from a pill survives its pill folding, the same promise the seam
// already makes for supply pins (spec §3.7).
//
// foldedKeys is the settled fold SET, not bookkeeping: dockPass (Task 6) reads
// it to skip a folded pill, which is why the two passes run in that order
// everywhere. Do not "clean it up" as write-only before that lands.
let foldedKeys = new Set();
// The demand twin (spec 2026-09-05-map-demand-union §2.4), declared beside its
// sibling because it is the same fact one kind over: a gig inside a cluster is
// already drawn by that cluster's amber digit, so its DOM badge hides.
//
// THE UNGATED SEAM, stated here rather than left to be discovered: a demand
// badge's m._gsKey is the gig's id (setDemandPoints stamps pt.id), and that is
// the SAME identifier refreshClusterSource projects as the feature's id and
// gigkeys accumulates. Two different languages - the expression accumulator and
// this DOM read - one identifier, and nothing asserts they are the same one.
// Stamp _gsKey from anything but pt.id, or project a different id into the
// feature, and every fold silently stops happening: a green build, a green
// suite, and every clustered gig drawn twice. (AGENTS.md carries it in the map
// declutter twins bullet, the evkeys <-> _gsKey entry one kind over.)
let foldedGigKeys = new Set();
function refold() {
  // PINS MODE UNFOLDS EVERYTHING, and never reads the source. The clusters
  // still EXIST above the seam (only their paint is 0), so querying them here
  // would hide the very pills that are the only thing drawn. BOTH kinds unfold
  // here, and BOTH sets are EMPTIED rather than merely left unread: the sets are
  // the shell's stated answer to "what is folded right now", so a stale one is a
  // lie waiting for the next reader, exactly as it would be for the event half.
  if (aggMode !== 'bubbles') {
    for (const m of eventMarkers) m.getElement().classList.toggle('gs-folded', false);
    for (const m of demandMarkers) m.getElement().classList.toggle('gs-folded', false);
    foldedKeys = new Set();
    foldedGigKeys = new Set();
    return;
  }
  // The ['has','point_count'] guard is not decoration: without it the >=
  // expression is evaluated against every SINGLETON too (which carries no
  // 'events' property at all) and MapLibre warns once per feature.
  //
  // ONE QUERY FOR BOTH KINDS, and the ['any'] arm is what buys that: a cluster
  // qualifies if it carries events OR gigs. The obvious alternative - two
  // querySourceFeatures sweeps, one per kind - costs a second full sweep on
  // EVERY settle, and there are four settle signals (zoomend, moveend, the
  // gated sourcedata arm, idle). One sweep, two accumulators read off the same
  // features.
  const feats = map.getSource('creators')
    ? map.querySourceFeatures('creators', { filter: ['all', ['has', 'point_count'], ['any', ['>=', ['get', 'events'], 1], ['>=', ['get', 'gigs'], 1]]] })
    : [];
  const nextEv = new Set();
  const nextGig = new Set();
  // evkeys is the |-joined accumulator (spec §3.1) and gigkeys is its exact
  // twin - same append of 'key|' per member, so every split leaves an empty
  // last field, and the SAME key can arrive in two clusters across a tile
  // boundary. The Set collapses the duplicate and the if (k) drops the empty,
  // for both. A cluster served by the widened filter may carry only ONE of the
  // two properties (an events-only cluster has no gigkeys at all), so the
  // missing-property read is the ordinary case here, not an edge.
  for (const f of feats) {
    for (const k of String(f.properties.evkeys || '').split('|')) if (k) nextEv.add(k);
    for (const k of String(f.properties.gigkeys || '').split('|')) if (k) nextGig.add(k);
  }
  foldedKeys = nextEv;
  foldedGigKeys = nextGig;
  // Each kind by its OWN accumulator, never crossed: folding a pill by gigkeys
  // would hide a satellite that nothing on the map is counting.
  for (const m of eventMarkers) m.getElement().classList.toggle('gs-folded', nextEv.has(m._gsKey));
  for (const m of demandMarkers) m.getElement().classList.toggle('gs-folded', nextGig.has(m._gsKey));
}
// THE DOCK PASS (spec §4.1), the HOST half of the pure layout in
// src/lib/map-dock-js.ts. A satellite - an event pill, a demand badge - that
// sits on top of a creator glyph is nudged into a slot AROUND that glyph, so
// both stay readable and the pair reads as belonging together.
//
// WHY THIS IS NOT THE BALTIC (spec §4.2, and the scar the demand block below
// still carries verbatim). That failure was a CONSTANT pixel offset applied
// with no reference to what the map showed, at a zoom where a pixel was a
// country wide. Every clause here is the opposite of that:
//   - an offset is non-zero ONLY when a same-ground anchor is under the
//     satellite (dockLayout's gate, fed DOCK_GROUND_M from here);
//   - it is measured from THAT anchor's projected position at the CURRENT
//     zoom, so it is visually attributable at every zoom - the badge on
//     Berlin's dot is Berlin's badge, attached;
//   - the COORDINATE never moves. There is no setLngLat in this pass. A drag
//     still tracks the true coordinate and pin-move-truth's live-position
//     comparison is untouched; the ground scatter is what makes these offsets
//     go to zero at city zoom.
// The stated cost: a cross-city pair (a Leverkusen event over Cologne's pins at
// z6.15) is NOT docked and may overlap until zooming separates it. Docking it
// would assert, in the only language a map has, that the event is in Cologne.
//
// SETTLE ONLY. Registered on zoomend/moveend and called from every setter,
// never per frame: a docked satellite and its anchor share (near-)identical
// coordinates, so their RELATIVE screen offset barely moves during a gesture,
// and a per-frame setOffset rounds to whole pixels and stutters.
function dockPass() {
  // The revert lever (spec §8.2). Off: satellites stay centre-anchored on their
  // own coordinates and setDemandPoints' legacy DEMAND_DODGE_ZOOM nudge runs
  // again instead - which is what makes this a revert rather than a hope.
  if (!DOCK_SATELLITES) return;
  // Nothing to place, and nothing to UN-place either: a removed marker took its
  // latch with it. Bailing here is what keeps a satellite-less map from paying
  // for two querySourceFeatures sweeps on every single settle.
  if (!eventMarkers.length && !demandMarkers.length) return;
  const bubbles = aggMode === 'bubbles';
  const satellites = [];
  const owners = new Map();
  for (let i = 0; i < eventMarkers.length; i++) {
    addSatellite(satellites, owners, eventMarkers[i], 'event', eventMarkers[i]._gsKey || ('ev#' + i));
  }
  for (let i = 0; i < demandMarkers.length; i++) {
    // PREFIXED, so the two marker sets' id spaces cannot collide: the results
    // are keyed by satellite id, and a gig id that happened to equal a place
    // key would hand one satellite the other's offset with nothing to notice it.
    addSatellite(satellites, owners, demandMarkers[i], 'gig', 'gig:' + (demandMarkers[i]._gsKey || i));
  }
  const rows = dockLayout({
    mode: bubbles ? 'bubbles' : 'pins',
    groundM: DOCK_GROUND_M,
    gapPx: DOCK_GAP_PX,
    overlapPx: DOCK_OVERLAP_BUBBLES_PX,
    anchors: bubbles ? glAnchors() : pinAnchors(),
    satellites: satellites,
  });
  // Keyed by ID, never by index: dockLayout returns rows in its OWN order (every
  // demand badge first, then event pills by hash) and OMITS every folded
  // satellite. So an id it never returned is a satellite that must sit on its
  // coordinate - [0, 0], written through the same latch, which is what clears
  // the stale offset off a pill that WAS docked and has just folded.
  const vecs = new Map();
  for (const r of rows) vecs.set(r.id, [Math.round(r.dx), Math.round(r.dy)]);
  for (const s of satellites) {
    const v = vecs.get(s.id) || [0, 0];
    applyDock(owners.get(s.id), v[0], v[1]);
  }
}

// A satellite's box IS measured (offsetWidth/offsetHeight), unlike an anchor
// pin's: a pill's width is its own text ('🎪' vs '🎪 12') and NOTHING
// transitions it, where the supply pin's 180ms size change makes the same read
// wrong for exactly as long as it matters.
function addSatellite(list, owners, m, kind, id) {
  const el = m.getElement();
  const ll = m.getLngLat();
  const at = map.project([ll.lng, ll.lat]);
  list.push({
    id: id,
    kind: kind,
    x: at.x,
    y: at.y,
    w: el.offsetWidth,
    h: el.offsetHeight,
    lat: ll.lat,
    lng: ll.lng,
    // refold() has already run at every call site, so this is the SETTLED fold
    // state: an invisible pill must never consume the one slot an identity dot
    // has (spec §4.1 step 1).
    folded: el.classList.contains('gs-folded'),
  });
  owners.set(id, m);
}

// PINS-MODE anchors: the DOM creator pins. The radius comes from the pin
// DIAMETER constants styleMarker paints with (map-dock-js.ts's PIN_D /
// PIN_D_PRO / PIN_D_ACTIVE, interpolated here exactly as they are there), never
// from offsetWidth - the .gs-supply size transition is 180ms, so a pin read
// mid-flip reports a box it does not have yet and the pill docks INTO it.
function pinAnchors() {
  const out = [];
  for (let i = 0; i < markers.length; i++) {
    const m = markers[i];
    const p = m._gigshotPoint;
    if (!p) continue;
    const ll = m.getLngLat();
    const at = map.project([ll.lng, ll.lat]);
    const pop = m.getPopup();
    const popupOpen = !!(pop && pop.isOpen && pop.isOpen());
    const base = p.pro ? 38 : 34;
    out.push({
      id: 'pin:' + (p.id != null ? p.id : i),
      x: at.x,
      y: at.y,
      r: (base + (popupOpen ? 6 : 0)) / 2,
      lat: ll.lat,
      lng: ll.lng,
      badgeSlots: [],
      accepts: 'all',
    });
  }
  return out;
}

// BUBBLES-MODE anchors: the two GL dot families (spec §2), read straight off
// the tiles. BUBBLES ARE NEVER ANCHORS - a satellite docked to a cluster would
// claim membership of a group it is not in.
//
// The identity-dot filter is the 'points' layer's own predicate - a TWIN, and
// both copies move together - and every term is load-bearing:
// querySourceFeatures is not filtered by any LAYER, an unclustered EVENT feature
// is GL-invisible below the DOM limit, and an unclustered GIG has no GL form at
// ALL (E5 cut the gig layer), so without those two terms a satellite could dock
// against nothing a viewer can see. The gig case is the sharper one: the badge
// standing ON that coordinate IS the gig's only form, so admitting the feature
// makes the badge dock to ITSELF (breaker C2).
function glAnchors() {
  if (!map.getSource('creators')) return [];
  const out = [];
  const seen = new Set();
  // slotsOf is a FUNCTION of the feature, not a constant, because a mixed dot's
  // badges are per-feature facts: which shoulders it actually wears depends on
  // its own counts (see the second take below).
  const take = (feats, r, slotsOf, badgeStandoff, accepts) => {
    for (const f of feats) {
      const key = featureKey(f);
      if (seen.has(key)) continue; // tiles overlap: the same dot arrives twice
      seen.add(key);
      const c = (f.geometry && f.geometry.coordinates) || [];
      const at = map.project([c[0], c[1]]);
      out.push({
        id: key, x: at.x, y: at.y, r: r,
        lat: c[1], lng: c[0], badgeSlots: slotsOf(f), badgeStandoff: badgeStandoff, accepts: accepts,
      });
    }
  };
  take(map.querySourceFeatures('creators', {
    filter: [
      'all',
      ['!', ['has', 'point_count']],
      ['!=', ['get', 'kind'], 'event'],
      ['!=', ['get', 'kind'], 'gig'],
    ],
  }), DOT_R_PX, () => [], undefined, 'all');
  // The MIXED dot (LED = 'dot'): below the dignity floor on BOTH counts, so it
  // wears a neutral face and its own count badges - the anchor's OWN furniture,
  // which is why a slot one covers is not free. It serves DEMAND
  // badges only: an event pill on it would be a second event glyph for a group
  // whose events are already counted inside it. Its badges sit at their OWN
  // standoff (DOT_BADGE_STANDOFF_PX), farther from the rim than a plain
  // bubble's badge would be - see that const's own comment in map-dock-js.ts
  // for the arithmetic, rather than repeating it here.
  //
  // THE SLOTS ARE DERIVED FROM THE FEATURE'S OWN COUNTS, never a hard-coded
  // ['TR'] (demand-union §2.4). Two ways the constant lied: ~30 of the 694
  // reachable dot cells carry no events at all, so there is no cyan badge at TR
  // to block anything; and since the demand wave a dot that folds a gig wears
  // an amber badge at TL, which the constant could not mention. A slot claimed
