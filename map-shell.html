  // by furniture that is not drawn pushes a satellite for nothing; a slot NOT
  // claimed by furniture that IS drawn puts the satellite under the badge.
  take(map.querySourceFeatures('creators', {
    filter: ['all', ['has', 'point_count'], ['<', ['get', 'people'], 5], ['<', ['get', 'events'], 5]],
  }), DOT_R_PX, (f) => {
    const pr = f.properties || {};
    return (pr.events >= 1 ? ['TR'] : []).concat(pr.gigs >= 1 ? ['TL'] : []);
  }, DOT_BADGE_STANDOFF_PX, 'gig');
  return out;
}

// Tile boundaries hand the SAME feature back from two tiles, and two anchors at
// one point would let a second satellite dock to the duplicate in the slot the
// first already took. cluster_id and the creator's own id are the stable
// identities; the coordinate is the last resort, and it is what keeps two
// genuinely different id-less features two.
function featureKey(f) {
  const p = f.properties || {};
  if (p.cluster_id != null) return 'c:' + p.cluster_id;
  if (p.id != null) return 'p:' + p.id;
  const c = (f.geometry && f.geometry.coordinates) || [];
  return 'x:' + c[0] + ',' + c[1];
}

// THE LATCH (spec §4.1 step 5). Writes only when the ROUNDED pair changed:
// setOffset lands on whole pixels anyway, and a settle that recomputes the same
// vector must not re-write a marker's transform - nor, worse, an open card's
// offset underneath the reader.
//
// An ABSENT latch reads as [0, 0] because that IS a fresh marker's real state:
// it is constructed anchor 'center' with no setOffset at all, and its popup
// with the bare 'offset: 18' that popupOffsetFor(18, 0, 0) matches on all nine
// anchors up to the library's own rounding of the diagonals (12.728 vs 13 -
// normalizeOffset applies Math.round to the corner components, this does not;
// sub-pixel, and never actually written because applyDock early-returns on
// [0, 0]).
// So the first pass writes only what actually has to move.
function applyDock(m, dx, dy) {
  const last = m._gsDock || [0, 0];
  if (last[0] === dx && last[1] === dy) return;
  m._gsDock = [dx, dy];
  m.setOffset([dx, dy]);
  const pop = m.getPopup();
  // 18 is the 'offset: 18' every satellite popup is constructed with (the pill
  // in setEventPoints, the badge in setDemandPoints) - change one and you must
  // change the other, or the card's tail lands on the pill it just avoided.
  if (pop) pop.setOffset(popupOffsetFor(18, dx, dy));
}

// MapLibre's Popup.normalizeOffset(n) turns a scalar into a PER-ANCHOR object:
// each anchor gets the point n px away along its own axis or diagonal, so a card
// tailing a marker from the left is pushed right by n and a corner anchor by
// n/sqrt(2) on each axis. That helper is private to the library and this shell
// cannot import it, so the nine entries are spelled out - and the dock vector is
// ADDED to every one of them, which is what keeps the card's standoff measured
// from where the satellite NOW IS rather than from the coordinate it left.
function popupOffsetFor(base, dx, dy) {
  const d = base / Math.SQRT2;
  return {
    center: [dx, dy],
    top: [dx, dy + base],
    'top-left': [dx + d, dy + d],
    'top-right': [dx - d, dy + d],
    bottom: [dx, dy - base],
    'bottom-left': [dx + d, dy - d],
    'bottom-right': [dx - d, dy - d],
    left: [dx + base, dy],
    right: [dx - base, dy],
  };
}
// SETTLE ONLY, never 'zoom': a fold class that flips at every integer-zoom
// crossing strobes through a pinch. Mid-gesture the GL badges may re-form while
// the pills hold their last settled state - a transient bounded by the gesture,
// the same discipline the seam keeps.
//
// The registration ORDER is the setters' order (spec §3.1): handler order IS
// dispatch order, so a settle that flips the mode ends with a dock that ran
// after the fold that ran after the flip.
map.on('zoomend', refold);
map.on('zoomend', dockPass);
// applyAggMode joins the moveend triple too (spec §3.1: applyAggMode, then
// refold, then dockPass, on BOTH settle events). Behaviourally it is a
// no-op today - aggModeFor is a function of zoom and two counts, none of
// which a pan changes, and MapLibre fires zoomend before moveend for any
// zoom-changing move - but the ordered triple is the contract, and a future
// term that a pan CAN change (a viewport-scoped count) would otherwise be
// read by the fold and the dock before the mode that governs them.
map.on('moveend', applyAggMode);
map.on('moveend', refold);
map.on('moveend', dockPass);
map.on('sourcedata', (e) => {
  // A bare data event fires while tiles are still 'reloading', where
  // querySourceFeatures would read the PREVIOUS union's clusters.
  // isSourceLoaded goes true exactly when the last reloading tile lands - but
  // it ALSO goes true when the last tile of an ordinary pan lands, hence the
  // isMoving guard, with moveend catching up at settle.
  //
  // map.isMoving() is the PUBLIC accessor, which is _moving || handlers.isMoving(),
  // and that handler half includes scroll-zoom's ~200ms finish tail - which is
  // what guarantees a sourcedata dropped here is always followed by a moveend.
  // Never "simplify" it to the private flag.
  if (e.sourceId !== 'creators' || !e.isSourceLoaded || map.isMoving()) return;
  refold();
  dockPass();
});
// THE CORRECTOR OF LAST RESORT, never the primary (Task 7's live-shell reading).
// MEASURED: a settle whose cluster tiles land after moveend folds 5 pills against
// 6 OLD clusters, and the gated sourcedata arm above ran with isSourceLoaded true
// and STILL read 3 where the settled answer was 0 - so those events were drawn by
// nothing until the next settle. 'idle' fires once after every render burst with
// no transition pending and every tile in view loaded, so BY CONSTRUCTION it runs
// after the last tile lands. It is the last resort and not the primary because it
// fires LATE on a slow link: the settle passes above are the fast path, and the
// sourcedata arm still corrects one tile-load earlier whenever it can. Both
// passes are latched/idempotent (the fold toggles classes to the same values; the
// dock writes nothing when the rounded offset is unchanged), so an extra run here
// costs one querySourceFeatures.
map.on('idle', () => {
  refold();
  dockPass();
});

// THE event-points LATCH (spec §3.6), the seam's counterpart for the one layer
// the seam does not own. Born false, matching a layer born at opacity 0: the
// gate that reveals it is not tripped at birth. setEventPoints (Task 5) calls
// this from the SAME count that decides whether DOM pills are built, so pills
// and dots never coexist.
//
// Latched for the reason applyAggMode is: a setter that re-paints on every push
// writes two identical paint properties per event refresh. The layer is created
// by ensureClusterLayers, which every setEventPoints call reaches through
// refreshClusterSource BEFORE it would call this — so there is no source guard
// here; the seam's own guard exists because zoomend can fire before any push.
let eventGlApplied = false;
function setEventGl(on) {
  const want = !!on;
  if (want === eventGlApplied) return;
  eventGlApplied = want;
  const v = want ? 1 : 0;
  map.setPaintProperty('event-points', 'icon-opacity', v);
  map.setPaintProperty('event-points', 'text-opacity', v);
}

function toGeoJSON(pts) {
  // REALM-SANITIZED properties (silent-failure hunt, 2026-07-29): the points
  // arrive from the HOST page via contentWindow calls, so ANY object among
  // them — the flat point itself included, which was the production hazard —
  // carries the host realm's prototypes. MapLibre's worker serializer checks
  // constructor IDENTITY against THIS realm's Object before posting to the
  // worker, so any host-realm object placed anywhere in the setData payload
  // makes the whole call throw ('cannot serialize object of unregistered
  // class') and the cluster source silently keeps stale data. Shipped with F3
  // (setClusterData only ran above 60 pins before it, so the seam never
  // crossed realms in production). The JSON round-trip rebuilds every value in
  // the shell realm and drops anything non-data; measured ~1ms per 200-point
  // pass, and the lastClusterSig short-circuit means it only runs on genuine
  // data change.
  return {
    type: 'FeatureCollection',
    features: pts.map(p => ({
      type: 'Feature',
      geometry: { type: 'Point', coordinates: [p.lng, p.lat] },
      properties: JSON.parse(JSON.stringify(p)),
    })),
  };
}

function ensureClusterLayers() {
  if (map.getSource('creators')) return;
  // The three GL supply layers below are BORN VISIBLE: their opacity paint is
  // the same flat pair applyAggMode's 'visible' arm sets (0.25 fill, 1
  // everywhere else), and the latch's initial value says so. The crossfade is a
  // SETTLE-time setPaintProperty ease, not a per-frame GPU curve — the full WHY,
  // and why the zoom-interpolated band it replaced was retired, is at
  // applyAggMode's paint arms. Nothing in here toggles layer VISIBILITY: that is
  // a binary layout flip, which cannot be eased at all.
  map.addSource('creators', {
    type: 'geojson',
    data: toGeoJSON([]),
    cluster: true,
    // clusterMaxZoom is the LAST zoom at which supercluster groups points;
    // ABOVE it every feature is emitted individually. It was 14, so from z15 up
    // NEAR-coincident creators were emitted as separate 'points' circles drawn
    // on top of each other: no count, no badge, nothing hinting that more than
    // one person is there, and only ONE of them reachable (the 'points' click
    // handler below takes e.features[0], an arbitrary winner). Landing next to
    // a rival made them effectively invisible and unclickable.
    //
    // Note what this does NOT cover, so nobody re-derives a false premise:
    // EXACTLY-coincident points never reach this source at all — useMapFrame
    // runs scatterColliding on every push, on both the DOM and the cluster path.
    // The residue this ceiling addresses is points that are CLOSE but distinct
    // (legacy rows, and the cross-table home-vs-window case 0139's server-side
    // separation deliberately does not cover) — those the client scatter leaves
    // alone, and they are precisely what overlapped from z15 up.
    //
    // Raising it to 17 keeps such a pair a COUNTED cluster bubble to street
    // zoom: the viewer sees "2", and the click routes through
    // getClusterExpansionZoom instead of silently picking a winner. Points
    // genuinely far apart are unaffected — clusterRadius is 50 SCREEN pixels,
    // so 0139's ~120m minimum separation un-clusters by ~z16 on its own.
    //
    // TWINNED with the cluster-tap fallback's ceiling below, and single-sourced
    // from CLUSTER_MAX_ZOOM in src/lib/mapHtml.ts so both move together — see
    // that const for the arithmetic that makes them twins.
    clusterMaxZoom: 17,
    clusterRadius: 50,
    // DIGNITY FLOOR (spec 2026-07-28 section 2.2): supercluster's default
    // minPoints=2 is tuned for thousands of points; at our N a "2" bubble
    // replaces two real, differentiated, tappable pins with a content-free
    // digit. 5 matches DIGNITY_THRESHOLD (src/hooks/useMapData.ts): one
    // principle, three enforcement points now (this option, the LED family
    // predicate below, and that hook). Interpolated from the DIGNITY const in
    // src/lib/mapHtml.ts, which is why the number is not typed here.
    // The KEY IS clusterMinPoints, not minPoints: this maplibre SOURCE option
    // wraps supercluster's own minPoints (the worker reads clusterMinPoints and
    // passes Math.max(2, it) down), and the two layers of the stack spell it
    // differently. Spelled the inner way it is an unknown property, which the
    // style-spec validator REJECTS and addSource then bails on, so the source
    // never exists at all.
    clusterMinPoints: 5,
    // THE UNION'S AGGREGATES (spec §3.1). The source carries creators AND
    // events now, so a cluster has to be able to say how many of each it holds:
    // point_count alone cannot tell a room full of people from a week full of
    // parties. Spelled ONCE in src/lib/mapHtml.ts (CLUSTER_PROPERTIES) and
    // interpolated, so the family tests execute these exact expressions through
    // the real supercluster rather than a hand-copied paraphrase.
    clusterProperties: {"people":["+",["case",["any",["==",["get","kind"],"event"],["==",["get","kind"],"gig"]],0,1]],"events":["+",["case",["==",["get","kind"],"event"],1,0]],"approx":["+",["case",["all",["==",["get","kind"],"event"],["==",["get","precise"],false]],1,0]],"evkeys":[["concat",["accumulated"],["get","evkeys"]],["case",["==",["get","kind"],"event"],["concat",["get","placeKey"],"|"],""]],"gigs":["+",["case",["==",["get","kind"],"gig"],1,0]],"gigkeys":[["concat",["accumulated"],["get","gigkeys"]],["case",["==",["get","kind"],"gig"],["concat",["get","id"],"|"],""]]},
  });
  map.addLayer({
    id: 'clusters', type: 'circle', source: 'creators',
    filter: ['has', 'point_count'],
    paint: {
      // FAMILY COLOUR (spec §3.2): an EVENT-LED cluster is cyan, everything else
      // stays the neutral accent purple.
      //
      // ACCENT-CONTRACT MIRROR. docs/ACCENT-CONTRACT.md section 3 freezes
      // CLUSTER circles neutral purple because a cluster "mixes owners" and
      // belongs to none of them. That still holds, and this is not a breach of
      // it: an event-led cluster is coloured by its LAYER, not by any owner.
      // It is the same reading that moved the GL 'points' layer to SUBJECT in
      // section 2's 2026-07-02 amendment (see that layer's own WHY below); the
      // design reviewer confirmed it, and the contract's row is amended in this
      // wave. Do not "fix" this back to a flat C.accent citing section 3.
      //
      // THE MIXED DOT'S COLOUR (demand-union spec §2.2). A dot holding PEOPLE is
      // the neutral accent as before; a dot holding NONE takes its LARGEST FOLDED
      // KIND, because a cluster can now be five open gigs and nothing else and
      // painting that as a lone creator dot is a lie about who is standing there.
      // A zero-people TIE - as many gigs as events - goes AMBER by the '>=':
      // demand is the call to action, so the tie goes to it. Stated here so
      // nobody reads it as an accident of operator choice.
      //
      // ACCENT-CONTRACT §3 again: like the cyan arm above, the amber is a LAYER
      // colour and not an owner's, and it can only ever land on a dot with zero
      // people - a glyph that stands for no person at all.
      'circle-color': ['case',
        ['==', ["case",[">=",["get","people"],5],"creator",[">=",["get","events"],5],"event","dot"], 'event'], C.cyan,
        ['==', ["case",[">=",["get","people"],5],"creator",[">=",["get","events"],5],"event","dot"], 'dot'], ['case',
          ['>', ['get', 'people'], 0], C.accent,
          ['>=', ['get', 'gigs'], ['get', 'events']], C.amber,
          C.cyan,
        ],
        C.accent,
      ],
      // The EVENT-pill treatment (founder call 2026-07-29): translucent accent
      // fill behind a solid accent border — the same rgba(accent, ~0.22)-over-
      // dark family the cyan event pills wear, so bubbles and events read as
      // siblings and the map shows through both. applyAggMode's 'visible' arm
      // restores exactly this number (the crossfade twins).
      'circle-opacity': 0.25,
      // SIZE AND NUMBER AGREE (spec §3.2): the step reads the same DIGIT the
      // label prints, never point_count — a mixed cluster sized by a total it
      // never shows would be a circle whose bigness means nothing on it. A dot
      // (neither count clears the floor) is the flat 10 the lone identity dots
      // already use, so an un-headlined group is the same size as one person.
      'circle-radius': ['case', ['==', ["case",[">=",["get","people"],5],"creator",[">=",["get","events"],5],"event","dot"], 'dot'], 10, ['step', ["case",["==",["case",[">=",["get","people"],5],"creator",[">=",["get","events"],5],"event","dot"],"creator"],["get","people"],["get","events"]], 16, 25, 22, 100, 28]],
      'circle-stroke-width': 2,
      // Border in the FAMILY colour, not text-white: the border carries the
      // identity now that the fill is translucent (exactly the event pill's
      // split), so it takes the same case as the fill above.
      'circle-stroke-color': ['case',
        ['==', ["case",[">=",["get","people"],5],"creator",[">=",["get","events"],5],"event","dot"], 'event'], C.cyan,
        ['==', ["case",[">=",["get","people"],5],"creator",[">=",["get","events"],5],"event","dot"], 'dot'], ['case',
          ['>', ['get', 'people'], 0], C.accent,
          ['>=', ['get', 'gigs'], ['get', 'events']], C.amber,
          C.cyan,
        ],
        C.accent,
      ],
      // Stated, not left implicit: applyAggMode drives this property to 0 with
      // the fill, and a property it never sets a starting value for would
      // outlive the fill and leave hollow rings ghosting over the pins.
      'circle-stroke-opacity': 1,
    },
  });
  map.addLayer({
    id: 'cluster-count', type: 'symbol', source: 'creators',
    filter: ['has', 'point_count'],
    // THE HEADLINE DIGIT (spec §3.2). A 'dot' cluster prints NOTHING: neither of
    // its counts clears the dignity floor, so a number there would headline
    // scarcity. The other two families print their OWN count, never point_count.
    //
    // point_count_abbreviated is RETIRED: it existed to render "1.2k", and
    // 'people' cannot reach four digits here (the client's max_points caps the
    // supply read at 500), so the abbreviation only ever cost us a number we
    // could not compose with. to-string, rather than a bare number, because a
    // raw number in a 'formatted' slot is not exercisable offline: the style
    // spec accepts it, but nothing in a node test can tell us what it renders.
    layout: {
      'text-field': ['case', ['==', ["case",[">=",["get","people"],5],"creator",[">=",["get","events"],5],"event","dot"], 'dot'], '', ['to-string', ["case",["==",["case",[">=",["get","people"],5],"creator",[">=",["get","events"],5],"event","dot"],"creator"],["get","people"],["get","events"]]]],
      'text-size': 13,
      'text-font': ['Noto Sans Bold'],
    },
    paint: {
      'text-color': '#ffffff',
      // Same paint state as the circle it sits on, so the digit and its bubble
      // leave together (fadeDuration:0 on the map puts them on one clock).
      'text-opacity': 1,
      // TRANSLUCENT dark halo, not opaque: at 1.0 the ring reads as a sticker
      // outline around the number. At 0.6 it only buys edge contrast, which the
      // label needs against BOTH the purple fill and, mid-crossfade as that fill
      // drops toward 0, whatever basemap is underneath (spec section 2.3).
      'text-halo-color': rgbaOf(C.bg, 0.6),
      'text-halo-width': 1.5,
    },
  });
  // Below the seam this layer is not empty: a cluster needs minPoints (5) to
  // form, so sub-dignity singletons paint here as their own identity dots WHILE
  // the bubbles are still up. That honest mixed state is the scatter-over-aggregate
  // decision working (spec section 2.2), not a bug to hide. It carries the SAME
  // paint state as the bubbles because it is on the same side of the seam: this
  // whole GL set hands over to the DOM markers above it, so the singletons must
  // leave with their bubbles or they linger as duplicate dots under the pins.
  map.addLayer({
    id: 'points', type: 'circle', source: 'creators',
    // UNCLUSTERED CREATORS ONLY (spec §3.2). The source carries events and open
    // gigs now, and neither must paint here: an event's visible form is the DOM
    // pill (folded or docked) and a gig's is the amber DOM badge, so a purple
    // identity dot under either would say "a person is here" about a party or a
    // request. Past the DOM limit the separate event-points layer paints the
    // event instead (§3.6); a gig has no GL form at all (E5). The TWIN of this
    // predicate is glAnchors' identity-dot query - change one, change the other.
    filter: [
      'all',
      ['!', ['has', 'point_count']],
      ['!=', ['get', 'kind'], 'event'],
      ['!=', ['get', 'kind'], 'gig'],
    ],
    paint: {
      // SOLID identity fill, not a hollow ring (FOUNDER CALL 2026-07-29, after
      // living with the shipped F3 seam). This used to be C.card — a DARK card
      // fill inside a 2px identity stroke — which at continent zoom read as an
      // EMPTY ring: a hole punched in the map rather than a person standing on
      // it. At 23 creators these dots ARE most of the zoomed-out map, so "empty"
      // was the whole first impression. Filled with the identity accent they say
      // "creators here" and carry the SAME identity the DOM pin takes on when you
      // zoom past the seam — one person, one colour, both sides of the handover.
      //
      // Data-driven identity (subject partition): DJ points fill ACID
      // (C.acid = mapDjAccent.text), everything else the purple accent — the
      // same split identColor() applies on the DOM-marker path. coalesce guards a
      // point with NO vertical at all (e.g. the dev dump script): match-on-null
      // is an evaluation error that paints black, not the fallback. Keep it.
      //
      // NOT an ACCENT-CONTRACT violation, so nobody "fixes" this back citing it:
      // docs/ACCENT-CONTRACT.md section 3 freezes CLUSTER circles neutral purple
      // because a cluster MIXES owners and belongs to none of them. This layer is
      // the UNCLUSTERED one — every circle here is exactly one creator, and
      // section 2's 2026-07-02 amendment lists the GL 'points' layer as a SUBJECT
      // surface: an individual identity IS accent-carrying (the DOM pins already
      // are). CORRECTED 2026-09-05 (this said "The 'clusters' layer above still
      // paints flat C.accent; untouched" — false since this wave made 'clusters'
      // paint BY FAMILY): the cluster circle is now event-cyan for an event-led
      // cluster and neutral purple otherwise, which is section 3's rule applied
      // to a MIXED owner set rather than a departure from it — cyan is the event
      // KIND's colour, not a creator's accent, so a cyan bubble still belongs to
      // no owner.
      // Shell-runtime calls (e.g. rgbaOf) in a match ARM are safe — computed
      // once at addLayer time, stored by MapLibre as plain values. In the match
      // INPUT they would also run exactly once and silently FREEZE a
      // per-feature decision into a constant — the general trap, kept here
      // beside the surviving match expressions after the glow arms (which used
      // rgbaOf) were superseded.
      'circle-color': ['match', ['coalesce', ['get', 'vertical'], ''], 'dj', C.acid, C.accent],
      // 9 -> 10: slightly more present at continent zoom. Deliberately NOT
      // bigger — dignity is presence, not shouting, and a fatter dot at N=23
      // starts merging neighbours back into the blobs the seam exists to avoid.
      'circle-radius': 10,
      // The EVENT-PILL FAMILY (founder call 2026-07-29, second half): the lone
      // dots wear the same translucent-fill + solid-border split as the cluster
      // bubbles and the cyan event pills — in the dot's OWN identity hue, so a
      // DJ dot is acid family and everyone else accent family. This supersedes
      // c18607a's opaque-fill + soft-glow look; the earlier "hollow rings read
      // as empty" concern does not return because the border is SOLID identity
      // (not a faint ring over a void) and the whole marker family now shares
      // the treatment — coherence is what makes translucency read as a style,
      // not a fade. applyAggMode's visible arm restores this fill (the
      // crossfade twins).
      'circle-opacity': 0.25,
      'circle-stroke-width': 2,
      // Solid identity border — the same match as the fill, full strength: the
      // border carries the identity now that the fill is translucent (the

    // 'event-points' joins the query only while the LATCH is on, and the array

    // Below the DOM limit that dot is invisible and sits under its own DOM pill:
    // querying it would promise a pointer over a target that is not there
    // (the pill carries its own cursor), which is the same defect the mode gate
    // above exists to prevent, one latch over.
    const hoverLayers = ['clusters', 'points', 'cluster-events', 'cluster-people', 'cluster-gigs'];
    if (eventGlApplied) hoverLayers.push('event-points');
    wantCursor(map.queryRenderedFeatures(e.point, { layers: hoverLayers }).length ? 'pointer' : '');
  });
  // Leaving the canvas entirely (including onto a sibling DOM marker, which
  // carries its own cursor) resets to the container's grab.
  map.on('mouseout', () => wantCursor(''));
}

// ONE SOURCE, THREE KINDS (spec §3.1, widened by the demand-union spec §2.1).
// This replaces setClusterData and keeps both
// of its jobs — the ensureClusterLayers call that creates the source on first
// use, and the signature short-circuit — but it now feeds the source the UNION
// of the current supply points, the current event points and the current open
// gigs, so a creator, an event and a request standing in the same city cluster
// TOGETHER instead of stacking three independent markers on one spot.
//
// It reads POINTS, EVENT_POINTS and DEMAND_POINTS rather than taking arguments,
// deliberately: every caller assigns its own array FIRST and then refreshes, so
// there is no way to push part of a union.
function refreshClusterSource() {
  ensureClusterLayers();
  // CREATORS keep every MapPoint property, plus kind STAMPED HERE. Stamped
  // rather than defaulted by the aggregate expression: a missing kind would
  // silently undercount, and the host has no business knowing this source
  // exists. They go through the EXISTING toGeoJSON realm rebuild (see its own
  // comment) because MapPoint has not been flat since 0183's offerings array,
  // and one host-realm object anywhere in a setData payload makes the worker
  // serializer throw while the source silently keeps stale data.
  const creators = toGeoJSON(POINTS.map(p => Object.assign({}, p, { kind: 'creator' })));
  const sigs = [];
  for (const p of POINTS) sigs.push('creator|' + p.id + '@' + p.lng + ',' + p.lat);
  // EVENTS are PROJECTED, never passed through: exactly the properties below
  // reach the tile, and never a person. The event pins spec's paywall seam holds
  // here too - an attendee name that arrived on the host object cannot leak into
  // a GL feature that anon eyes can query. Built as a fresh shell-realm literal
  // of scalars, which is its own realm safety (no round-trip needed).
  const events = [];
  // THE UNION HALF OF THE EVENTS_IN_SOURCE LEVER (spec §8.2). Read HERE, not
  // only at applyAggMode's call site and the pill-build gate: with the lever off
  // and this loop still running, the mode gate went inert and pills were built
  // unconditionally WHILE the aggregate arm stayed fully live - every pill built
  // AND folded into clusters that still carried badges, which is worse than
  // either endpoint and is the arm reached for during an incident. Off, no
  // cluster can reach events >= 1, so refold() folds nothing on its own.
  // The signature's EVENT_POINTS.length prefix stays outside the gate: it can
  // only cause a redundant re-push, never a stale one.
  if (EVENTS_IN_SOURCE) for (const e of EVENT_POINTS) {
    // A coordless event is DROPPED, never projected with a NaN geometry. The
    // asymmetry with the DOM pill loop (which skips the same way) is deliberate
    // and the blast radius is why: a skipped pill costs one missing marker,
    // while ONE NaN coordinate in a setData payload invalidates the WHOLE
    // FeatureCollection - maplibre's worker keeps the previous data and the
    // source silently goes stale, the same class toGeoJSON's realm scar records.
    // Unreachable today - the host's pin builder in src/lib/event-pins.ts drops
    // an unplaceable event before it can be pushed. This is the tripwire for the
    // day that stops being true. (That builder is named WITHOUT its call paren
    // on purpose: tests/event-pins.test.ts's one-caller rule counts the name
    // plus a paren textually across src/, and a comment would read as a caller.
    // No backticks either - this comment is inside the shell template literal,
    // and one backtick anywhere in it terminates the literal.)
    if (typeof e.lng !== 'number' || typeof e.lat !== 'number') continue;
    const props = {
      kind: 'event',
      id: e.placeKey, // the union's identity field: an event IS its place key
      placeKey: e.placeKey,
      name: e.name,
      nearCity: e.nearCity,
      goingCount: e.goingCount,
      gigCount: e.gigCount,
      precise: e.precise,
      whenLine: e.whenLine,
      datesUnconfirmed: e.datesUnconfirmed,
      crewBand: e.crewBand,
      lat: e.lat,
      lng: e.lng,
    };
    events.push({ type: 'Feature', geometry: { type: 'Point', coordinates: [e.lng, e.lat] }, properties: props });
    // EVERYTHING the GL layers and the GL popup read off the tile, in a fixed
    // order - not only identity. Keying an event on two fields left the popup's
    // other six stale past the DOM limit, where the tile IS the only copy: a
    // going count that changed while the key did not simply never re-pushed.
    // So any event refresh re-pushes the whole union (and re-clusters the
    // creators with it: ~700 features, milliseconds, the price of a correct
    // GL digit) while a creator refresh with unchanged identity still does not.
    sigs.push('event|' + props.id + '@' + props.lng + ',' + props.lat + '|' + [
      props.placeKey, props.name, props.nearCity, props.goingCount, props.gigCount,
      props.precise, props.whenLine, props.datesUnconfirmed, props.crewBand,
    ].join('|'));
  }
  // GIGS are projected IDENTITY-ONLY (demand-union spec E7): kind, id and the
  // coordinate, and NOTHING else - not the gig's label, not the poster's name.
  // With the GL gig layer cut (E5) nothing anywhere reads a gig field off a tile,
  // so a richer feature would have no reader at all; and since anything on a tile
  // is queryable by anon eyes, projecting only identity makes the parent wave's
  // paywall rule true BY CONSTRUCTION here rather than by policy. The poster's
  // name still reaches the DOM badge's popup, which is host-side and never a
  // tile property.
  const gigs = [];
  // THE UNION HALF OF THE DEMAND_IN_SOURCE LEVER (demand-union spec §2.6), read
  // HERE for the reason the event loop above states about its own: a lever read
  // at only some of its sites leaves the aggregate arm live while the rest of the
  // wave believes it is off. E5 cut the count-gate term and the GL layer, so this
  // loop is the lever's ONLY site and switching it off restores exactly today's
  // demand layer. The signature's DEMAND_POINTS.length prefix stays outside the
  // gate: it can only cause a redundant re-push, never a stale one.
  if (DEMAND_IN_SOURCE) for (const g of DEMAND_POINTS) {
    // Belt and braces, exactly as the event loop above: buildDemandPoints already
    // drops a coordless gig host-side, and ONE NaN coordinate in a setData
    // payload invalidates the WHOLE FeatureCollection while the source silently
    // keeps stale data. This is the tripwire for a caller that does not drop it.
    if (typeof g.lng !== 'number' || typeof g.lat !== 'number') continue;
    const props = { kind: 'gig', id: g.id, lat: g.lat, lng: g.lng };
    gigs.push({ type: 'Feature', geometry: { type: 'Point', coordinates: [g.lng, g.lat] }, properties: props });
    // IDENTITY ALONE keys a gig - the whole opposite of the event half above, and
    // for the same reason it is: the signature must cover everything a GL surface
    // reads off the tile, and for a gig that is exactly kind, id and coordinate.
    sigs.push('gig|' + props.id + '@' + props.lng + ',' + props.lat);
  }
  // Skip a redundant setData: a small pan that keeps the SAME points in view
  // still re-queries and re-pushes; re-setting an identical FeatureCollection
  // needlessly recomputes clusters (and, pre-fadeDuration:0, re-faded the count
  // labels). Per-feature signatures join on a separator the per-property join
  // above does not use, and the three counts prefix the whole string: this is a
  // CHANGE DETECTOR, not an identity, and those two guards are what keep a
  // value containing the separator from aliasing across a feature boundary.
  const sig = POINTS.length + '/' + EVENT_POINTS.length + '/' + DEMAND_POINTS.length + ':' + sigs.join('~');
  if (sig === lastClusterSig) return;
  lastClusterSig = sig;
  map.getSource('creators').setData({
    type: 'FeatureCollection',
    features: creators.features.concat(events, gigs),
  });
}

// opts.fit === false keeps the current camera — used by every non-initial push
// (a filter change) and pick-on-map, so re-pushing points never yanks the map
// away from where the user just looked. Only the first load / city-focus fits.
window.setPoints = function (pts, opts) {
  POINTS = pts;
  const fit = !opts || opts.fit !== false;
  if (pts.length <= DOM_MARKER_LIMIT) {
    // BOTH presentations are always fed (spec §2). This used to push [] to the
    // cluster source, which left the low-zoom side EMPTY: the crossfade faded
    // the pins out over nothing. The mode flag alone decides what is VISIBLE
    // (applyAggMode's two flat paint states) and what is tappable; the data
    // layer stays dumb and feeds both.
    refreshClusterSource(); // POINTS was assigned above: the array first, then the union
    syncMarkers(pts); // DIFF — keep existing pins in place (no jump/flicker)
    if (fit) fitAll();
    // A COUNT change alone can force the mode (the zoom listener would not
    // fire), so re-evaluate at the end of BOTH branches — and then the SAME
    // fixed order the settle listeners and setEventPoints keep (spec §3.1): a
    // creator push changes the ANCHORS, so the pills and badges resting on them
    // have to be re-folded and re-docked or they keep last push's placement.
    applyAggMode();
    refold();
    dockPass();
  } else {
    // Above the DOM limit the DOM path is dropped entirely: 60+ emoji markers
    // is the churn the GL path exists to replace, and the mode is count-forced
    // to bubbles at every zoom anyway, so there is nothing for them to fade in to.
    clearMarkers();
    refreshClusterSource();
    if (fit) fitAll();
    applyAggMode();
    refold();
    dockPass();
  }
};

// The demand-anchored context layer (Phase 3): render OPEN REQUESTS as AMBER
// 📣 badges, VISUALLY DISTINCT from the green/purple supply pins, so the map
// reads as "a scene" (demand present even when supply is thin) without ever
// being mistaken for a bookable creator. These are simple, non-clustered, and
// sit BELOW the supply markers in z-index. Robust to an empty array (just clears).
window.setDemandPoints = function (pts, reducedMotion) {
  // THE FIXED ORDER (spec §3.1, demand-union spec §2.1), every step of it
  // load-bearing - the same order setEventPoints keeps, with the motion flag in
  // front of it:
  //   setReduceMotion FIRST and BEFORE the empty-array early return below,
  //     deliberately: a push that CLEARS the demand layer still carries the
  //     current motion preference, and this is the only channel the host has for
  //     it (useMapFrame's pushDemandPoints types the argument as a plain boolean
  //     and passes it on every call, including the empty one). Sets the seam's
  //     .gs-rm as well as this layer's own pulse;
  //   the ARRAY next, or the union refresh below reads the previous push;
  //   the UNION then, and ALSO before the early return - an emptied demand layer
  //     (the Open gigs tickbox) must reach the union, or hidden gigs keep forming
  //     clusters and keep being counted by an amber badge;
  //   applyAggMode after it. The count gate has no gig term (E5 cut it), so this
  //     call cannot change the mode by itself today - it is here because it is
  //     idempotent and because all four setters keeping ONE shape is what stops
  //     the next person from having to work out which of them is the exception.
  //     Do not "optimise" it away;
  //   refold after the mode, since it branches on the mode the flip just set -
  //     run before the flip it would unfold exactly what the flip folds;
  //   dockPass LAST, because it skips folded satellites.
  setReduceMotion(reducedMotion);
  DEMAND_POINTS = pts || [];
  refreshClusterSource();
  applyAggMode();
  for (const m of demandMarkers) m.remove();
  demandMarkers = [];
  if (!DEMAND_POINTS.length) {
    // The dock pass reads demandMarkers and eventMarkers as the satellites'
    // truth, so an EMPTY push has to reach it too: there is nothing left to
    // un-dock (a removed marker took its latch with it), but the event pills
    // that were sharing an anchor with these badges may now have a free slot.
    // refold comes with it for the mirror reason: no gig has any form now, DOM
    // or GL, so nothing may still be folded on their account.
    refold();
    dockPass();
    return;
  }
  for (const pt of DEMAND_POINTS) {
    if (typeof pt.lng !== 'number' || typeof pt.lat !== 'number') continue;
    const el = document.createElement('div');
    // THE FOLD BASE CLASS (demand-union spec §2.4), the event pill's .gs-event one
    // kind over: it carries the transition list only, and the hidden state is
    // .gs-folded, which refold() toggles. Set here, before any inline style below,
    // for the reason the supply pins' own class is: the element must never exist
    // un-classed for a frame. It goes on BESIDE the pulse below, never instead of
    // it - the beacon survives on every DOM badge.
    el.classList.add('gs-gig');
    el.setAttribute('aria-label', 'Open gig');
    el.textContent = '📣';
    // Amber rounded badge, slightly translucent — clearly NOT a supply pin.
    // Fill, border and glow all derive from C.amber (theme.ts mapDemandAmber) —
    // one source for the whole demand family, so a token retune moves every
    // amber surface at once.
    el.style.cssText =
      'display:flex;align-items:center;justify-content:center;' +
      'width:30px;height:30px;border-radius:30%;box-sizing:border-box;' +
      'background:' + rgbaOf(C.amber, 0.22) + ';border:2px solid ' + C.amber + ';' +
      'font-size:15px;cursor:pointer;' +
      'box-shadow:0 2px 10px ' + rgbaOf(C.amber, 0.45) + ';' +
      // Demand is a recruiting signal — it must be SEEN, not hidden behind a
      // supply pin at the same city. The marker is offset UP (below) so the badge
      // floats above the city's supply pin; both stay visible. z-index above
      // supply (1–3) but below an open popup (10).
      'z-index:6;';
    // Soft amber pulse: skipped when reduced motion is on. Reads the shell-global
    // flag rather than the argument, so this layer and the seam can never
    // disagree about the preference.
    if (!reduceMotionFlag) el.classList.add('gs-pulse');
    const popup = new maplibregl.Popup({ offset: 18, closeButton: false, maxWidth: '250px', className: 'gigshot-popup' })
      .setHTML(
        '<div style="width:210px;padding:12px 14px;font-family:system-ui,sans-serif">' +
          '<div style="font-size:13px;font-weight:800;color:' + C.amber + '">📣 ' + esc(pt.label || 'Open gig') + '</div>' +
          '<div style="font-size:12px;color:' + C.mutedStrong + ';margin-top:6px">' + esc(pt.posterName || 'Someone') + ' is looking. Tap to respond.</div>' +
          '<button class="gs-respond" ' +
            'style="margin-top:10px;width:100%;padding:8px;border:0;border-radius:8px;cursor:pointer;' +
            'background:' + C.amber + ';color:#111;font-weight:800;font-size:13px">Respond</button>' +
        '</div>'
      );
    // Route the demand popup through the shared tracker so click-outside closes it
    // (and it never stacks with a supply card).
    popup.on('open', () => {
      markPopupOpen(popup);
      // Bind Respond via a CLOSURE (pt.id captured) — never interpolate an id into
      // an onclick string: an HTML-attribute + JS-string double context is the
      // wrong place for HTML-entity escaping (the browser entity-decodes before
      // the JS parses). pt.id is a server UUID today; the DOM listener removes the
      // footgun regardless of the id source.
      const pel = popup.getElement();
      const btn = pel && pel.querySelector('.gs-respond');
      if (btn) btn.onclick = () => window.notify({ type: 'demand', id: pt.id });
    });
    popup.on('close', () => { if (openPopup === popup) openPopup = null; });
    // Anchor CENTER with no static pixel offset — a fixed offset is a fixed
    // SCREEN distance, but the map projects a fixed GROUND distance per pixel
    // that shrinks as you zoom in. At the default zoom (~3.4) a 30px nudge is
    // 300-500km, which threw a Berlin badge out over the Baltic. Center anchor
    // means the badge sits exactly on its coordinate at ANY zoom; the upward
    // dodge (to clear a same-city supply pin) is applied only once we're at
    // city scale, via demandZoomTick below.
    //
    // REVISED 2026-09-05 (spec 2026-09-05-map-pin-declutter §4.2): the zoom
    // threshold above is replaced by dockPass, which offsets a badge ONLY when
    // a same-ground creator glyph is actually under it and only by the distance
    // that clears THAT glyph — so the dodge is earned per badge instead of
    // switched on for all of them at z9. The scar stands unaltered because it
    // is still the reason nothing here writes a standing offset (the figure it
    // quotes is the low-zoom worst case; at 51°N the charter's geometry table
    // puts the same 30px at ~140 km — either way it is a country, not a dodge).
    // The threshold machinery is KEPT, alive only behind DOCK_SATELLITES ===
    // false (spec §8.2), which is why it is not deleted here.
    const m = new maplibregl.Marker({ element: el, anchor: 'center' })
      .setLngLat([pt.lng, pt.lat])
      .setPopup(popup)
      .addTo(map);
    // The dock pass's stable satellite id — the same job m._gsKey does on an
    // event pill. It orders two badges sharing one pin by IDENTITY, so they
    // never swap slots merely because the host re-pushed its array differently.
    m._gsKey = pt.id;
    // LEGACY, alive only behind the lever: with the dock pass on, a badge is
    // born with NO offset and gets one only if dockPass finds it something to
    // yield to. dockPass() at the end of this function is what applies it.
    if (!DOCK_SATELLITES) m.setOffset(DEMAND_DODGE_ZOOM <= map.getZoom() ? [0, -30] : [0, 0]);
    demandMarkers.push(m);
  }
  // LAST, after the whole set exists: refold decides which of these badges is
  // inside a cluster and the pass places every VISIBLE satellite against every
  // anchor in one sweep, so neither may run per marker.
  refold();
  dockPass();
};

// City-scale threshold: below this, demand badges sit exactly on their
// coordinate (offset [0,0]) since a same-city supply-pin collision can't
// happen at continent/country zoom anyway. At/above it, nudge the badge up
// [0,-30] so it clears a same-city supply pin, mirroring the old fixed offset
// but now scoped to the zoom level where 30px is actually a small, sane
// screen distance instead of hundreds of km.
//
// REVISED 2026-09-05 (spec 2026-09-05-map-pin-declutter §8.2): SUPERSEDED by
// dockPass, and KEPT ALIVE behind DOCK_SATELLITES === false so that flipping
// the lever restores today's behaviour exactly — not "no dodge", which would
// be a third behaviour nobody has ever seen. The const itself stays at top
// level because setDemandPoints' own gated branch reads it; only the standing
// listener is inside the lever, because a tick that rewrites every badge's
// offset on a zoom threshold is precisely what the dock pass replaces.
const DEMAND_DODGE_ZOOM = 9;
if (!DOCK_SATELLITES) {
  let lastDemandDodge = null;
  map.on('zoomend', () => {
    const dodge = map.getZoom() >= DEMAND_DODGE_ZOOM;
    if (dodge === lastDemandDodge) return; // only repaint when the threshold is crossed
    lastDemandDodge = dodge;
    for (const m of demandMarkers) m.setOffset(dodge ? [0, -30] : [0, 0]);
  });
}

// The EVENT layer: upcoming events (event_supply) drawn as CYAN 🎪 PILLS that
// carry the going count on the pin itself. Three deliberate differences from the
// two layers above, so an event can never be misread as a bookable creator or as
// an open gig:
//   shape  a wide pill, not a circle (creator) or a rounded square (demand);
//   colour cyan, nowhere near the amber demand badge or the purple/green supply
//          pins;
//   glyph  🎪 plus a NUMBER, so it reads as a crowd, not as a person.
// No pulse: the beacon animation is the demand layer's signature ("someone is
// looking, respond"). An event is not a call to action, and reusing the pulse
// would blur exactly the distinction this layer exists to make. That is also why
// this takes no reducedMotion argument.
// Counts only, no names of attendees: this pin sits on the free side of the
// paywall seam, and the popup's only outbound move is into /place/{key}.
// Robust to an empty array (just clears).
window.setEventPoints = function (pts) {
  // THE FIXED ORDER (spec §3.1), every step of it load-bearing:
  //   the ARRAY first, or the union refresh below reads the previous push;
  //   the UNION next, and BEFORE the empty early return - the same placement
  //     setReduceMotion has in setDemandPoints, for the same reason: a [] push
  //     (the Events tickbox) must reach the union, or hidden events keep
  //     forming clusters and keep wearing badges;
  //   applyAggMode THEN, because the mode is a function of the event count too
  //     and the zoom listener will not fire for a count change (the empty arm
  //     matters most: 130 events -> 0 must flip bubbles -> pins);
  //   refold AFTER the mode, since it branches on the mode the flip just set -
  //     run before the flip it would unfold exactly what the flip folds;
  //   dockPass LAST, because it skips folded pills.
  EVENT_POINTS = pts || [];
  refreshClusterSource();
  applyAggMode();
  for (const m of eventMarkers) m.remove();
  eventMarkers = [];
  if (!EVENT_POINTS.length) {
    // No event has any form now, DOM or GL, so the latch drops with the pills.
    setEventGl(false);
    refold();
    dockPass();
    return;
  }
  // THE PILL-BUILD GATE (spec §3.6). Past the limit the GL event dots are the
  // event's only form, so no pills - and BOTH terms are read: with the union
  // switched off there is no GL form at all, so gating the mode without gating
  // the build here made every event past the limit vanish (round-5 B1).
  // ONE setter, ONE count, both decisions: pills and dots never coexist.
  // The loop below IS the whole gated body - refold/dockPass at the end of the
  // function run either way, because a push past the limit still has to fold
  // (nothing) and dock (the demand badges Task 6 adds).
  const glOnly = EVENTS_IN_SOURCE && EVENT_POINTS.length > EVENT_DOM_LIMIT;
  setEventGl(glOnly);
  if (!glOnly) for (const pt of EVENT_POINTS) {
    if (typeof pt.lng !== 'number' || typeof pt.lat !== 'number') continue;
    const going = typeof pt.goingCount === 'number' ? pt.goingCount : 0;
    // precise === false means the coordinate is area-scale, not a surveyed
    // point - EITHER the near-city fallback centroid OR a picked place that is
    // itself settlement-scale (city/town/village; see PLACE_KINDS in
    // src/lib/event-pins.ts, rung 0), never the event's own precise ground
    // either way. The 'near {nearCity}' popup line below stays honest in both
    // cases, since nearCity is always the event's own declared city. The pin
    // must then look inferred: a dashed border and a lighter fill, so an
    // approximate placement never wears the same confident outline as a
    // surveyed one.
    const approx = pt.precise === false;
    const el = document.createElement('div');
    // THE FOLD BASE CLASS (spec §3.4). It carries the transition list only; the
    // hidden state is .gs-folded, which refold() toggles. Set here, before any
    // inline style below, for the reason the supply pins' own class is: the
    // element must never exist un-classed for a frame.
    el.classList.add('gs-event');
    el.setAttribute(
      'aria-label',
      (pt.name || 'Event') + (going ? ', ' + going + ' going' : ', no crew yet') + (approx ? ', approximate location' : ''),
    );
    // textContent, NOT innerHTML: assigning text is itself the escaping, so
    // esc() must not be used here (it would render a literal &amp;). esc() is
    // for the popup's setHTML below, where the value really is parsed as markup.
    // ZERO-CREW FACE (spec 2026-08-26-zero-attendance-layer Z3): at zero the
    // pill is the bare glyph — a '0' on the pin reads as dead, and the popup
    // carries the story ('No crew here yet' / 'Be the first' below).
    el.textContent = going ? '🎪 ' + going : '🎪';
    el.style.cssText =
      'display:flex;align-items:center;justify-content:center;' +
      'height:26px;padding:0 9px;border-radius:999px;box-sizing:border-box;' +
      // Every cyan here derives from C.cyan (theme.ts mapEventCyan). The APPROX
      // pair stays a pair: a lighter fill AND a translucent dashed border, so an
      // inferred coordinate never wears a surveyed one's confident outline.
      'background:' + rgbaOf(C.cyan, approx ? 0.14 : 0.22) + ';' +
      'border:2px ' + (approx ? 'dashed' : 'solid') + ' ' + (approx ? rgbaOf(C.cyan, 0.65) : C.cyan) + ';' +
      'color:#e6fbff;font-family:system-ui,sans-serif;font-size:12px;font-weight:800;' +
      'line-height:1;white-space:nowrap;cursor:pointer;' +
      'box-shadow:0 2px 10px ' + rgbaOf(C.cyan, approx ? 0.18 : 0.38) + ';' +
      // Above the supply pins (1-3) so a city's event stays visible over its
      // creators, but BELOW the demand badge (6): an open gig is someone waiting
      // for an answer, which outranks context. Popups stay above all of it (20).
      'z-index:5;';
    // ONE CARD, TWO SURFACES (spec §3.6): the pill and the GL event dot render
    // the SAME markup, because eventPopupHtml is one function with two callers.
    // This used to compose a fromDate–toDate range inline; the event's dates are
    // the PAGE's own strings now (whenLine / datesUnconfirmed / crewBand, D5),
    // and nothing in this shell composes a second date line — the /scene scar.
    const popup = new maplibregl.Popup({ offset: 18, closeButton: false, maxWidth: '250px', className: 'gigshot-popup' })
      .setHTML(eventPopupHtml(pt));
    popup.on('open', () => {
      // Shared tracker: click-outside and ESC close this card, and it can never
      // stack with a supply or demand card.
      markPopupOpen(popup);
      // Bind via a CLOSURE (pt.placeKey captured), never an interpolated onclick
      // string: an HTML attribute plus a JS string is a double context that
      // entity-decodes before the JS parses. A place key is a server slug today,
      // and the DOM listener removes the footgun whatever it becomes.
      const pel = popup.getElement();
      const btn = pel && pel.querySelector('.gs-event-going');
      if (btn) btn.onclick = () => window.notify({ type: 'event', placeKey: pt.placeKey });
    });
    popup.on('close', () => { if (openPopup === popup) openPopup = null; });
    // anchor CENTER with NO setOffset. A pixel offset is a fixed SCREEN distance
    // but a varying GROUND distance, which is how a 30px nudge once threw a
    // Berlin badge into the Baltic at low zoom. Event pins need no dodge at all:
    // same-coordinate events are separated host-side by scatterColliding.
    //
    // REVISED 2026-09-05 (spec 2026-09-05-map-pin-declutter): a pill now DOCKS
    // (Task 6 - a pixel offset from a same-ground anchor, recomputed at every
    // settle, never a standing offset on a marker) and FOLDS (this task - a
    // class, when a cluster already draws its event). The scar above is exactly
    // why neither of those moves the COORDINATE: the marker keeps sitting on
    // pt.lng/pt.lat at every zoom, and the two passes only ever change how it is
    // PRESENTED there.
    const m = new maplibregl.Marker({ element: el, anchor: 'center' })
      .setLngLat([pt.lng, pt.lat])
      .setPopup(popup)
      .addTo(map);
    // The fold key: what refold() matches against a cluster's evkeys. Stamped on
    // the marker, not looked up by index, because eventMarkers and EVENT_POINTS
    // do NOT line up - a coordinate-less point is skipped above.
    m._gsKey = pt.placeKey;
    eventMarkers.push(m);
  }
  refold();
  dockPass();
};

map.on('load', () => {
  // FIRST, before anything can create a layer that names one of them: a symbol
  // layer whose icon-image is missing draws no icon at all (spec §3.3). The
  // layers are created by the setPoints push two lines down, via
  // ensureClusterLayers.
  makeBadgeImages(map);
  retintMap(map);
  window.setPoints(POINTS);
  // Stated explicitly rather than left to setPoints' internals: the seam must
  // have a decided mode before the first gesture, or the first zoomend is the
  // one that creates it and the initial frame renders with neither side gated.
  // Latched, so the (usual) case where setPoints already settled it is free.
  applyAggMode();
  window.notify({ type: 'ready' });
});

function boundsOf(pts) {
  const b = new maplibregl.LngLatBounds();
  for (const p of pts) b.extend([p.lng, p.lat]);
  return b;
}

// See the trimOutliersJs doc comment in src/lib/mapHtml.ts for the full WHY.
// Robust (median + median-distance) outlier trim for the auto-fit camera only.
// It NEVER touches the rendered point set, only which points the camera frames.
function trimOutliers(pts) {
  if (!pts || !pts.length) return pts;
  const fin = [];
  for (const p of pts) {
    if (Number.isFinite(p.lat) && Number.isFinite(p.lng)) fin.push(p);
  }
  // Too few points to tell an outlier from the distribution: leave it alone
  // (return the ORIGINAL array so non-finite rows keep their previous handling).
  if (fin.length < 8) return pts;
  const med = function (xs) {
    const s = xs.slice().sort(function (a, b) { return a - b; });
    const h = s.length >> 1;
    return s.length % 2 ? s[h] : (s[h - 1] + s[h]) / 2;
  };
  const mLat = med(fin.map(function (p) { return p.lat; }));
  const mLng = med(fin.map(function (p) { return p.lng; }));
  // Scale longitude by cos(lat) so a "degree" means the same ground distance on
  // both axes (1 deg of longitude is ~62km at 55N vs ~111km at the equator).
  // Near-pole guard mirrors map-scatter.ts.
  const cosLat = Math.max(Math.cos(mLat * Math.PI / 180), 0.01);
  const d = fin.map(function (p) {
    const dy = p.lat - mLat;
    const dx = (p.lng - mLng) * cosLat;
    return Math.sqrt(dy * dy + dx * dx);
  });
  // The floor is 20 SCALED DEGREES (~2200km), not a tight number, and that is
  // load-bearing: this trim exists ONLY to stop a poisoned coordinate (null
  // island, swapped lat/lng, mid-Atlantic) from collapsing the initial fit to a
  // hemisphere — it must NEVER drop an honest cohort. At floor 5 it did exactly
  // that on our own launch geography: 15 Berlin + 4 Barcelona dropped all four
  // Spanish creators from the first frame, so a Spaniard opened the app and
  // their own country was out of view. Any honest intra-European set stays
  // inside 20; all three poison vectors still trip it (null island ~52 scaled
  // deg from a European mass, swapped lat/lng ~39, mid-Atlantic ~39).
  const keepR = Math.max(med(d) * 6, 20);
  const kept = [];
  for (let i = 0; i < fin.length; i++) {
    if (d[i] <= keepR) kept.push(fin[i]);
  }
  // Nothing was an outlier: hand the ORIGINAL array back, so the common case is
  // free and identity-stable (same idiom as map-scatter.ts's "when nothing
  // collides the input array is returned unchanged").
  if (kept.length === pts.length) return pts;
  // Dropping a lot means the data is genuinely spread out, not poisoned: fit it all.
  if (kept.length < 3 || kept.length < fin.length * 0.75) return pts;
  return kept;
}


// See the aggModeJs doc comment in src/lib/mapHtml.ts for the full WHY.
const AGG_IN = 6.15;   // pins earned here (ONE number, interpolated from the TS const)
const AGG_OUT = 5.85;  // bubbles earned only well BELOW it: the gap between the two IS the hysteresis
function aggModeFor(prevMode, zoom, count, eventCount) {
  // TWO count gates, one decision. The EVENT one exists because a clustered
  // event's ONLY GL form is its cluster's circle and badge, which pins mode
  // paints to 0: past the DOM limit no pills are built, so the mode MUST be
  // bubbles or those events have no visible form at all. eventCount is
  // OPTIONAL - an older three-argument call passes undefined, and
  // undefined > n is false, so it never trips.
  // EVENT_DOM_LIMIT is INTERPOLATED from the ONE TS const, exactly as AGG_IN is
  // two lines above, and deliberately NOT comment-mirrored like the 60 below:
  // the EVENT_DOM_LIMIT = Infinity revert lever (spec 8.2) has to be able to
  // reach the term it names, and a comment cannot be reached.
  if (count > 60 || eventCount > 120) return 'bubbles'; // DOM_MARKER_LIMIT: cluster-only at any zoom
  if (prevMode !== 'bubbles' && prevMode !== 'pins') return zoom < 6 ? 'bubbles' : 'pins'; // 6 mirrors PHOTO_ZOOM (mapHtml.ts): kept in sync by comment only, same reason as the 60/DOM_MARKER_LIMIT pair, since this string is evaluated standalone in tests
  if (prevMode === 'bubbles') return zoom >= AGG_IN ? 'pins' : 'bubbles';
  return zoom <= AGG_OUT ? 'bubbles' : 'pins';
}


// See the dockJs doc comment in src/lib/map-dock-js.ts for the full WHY.
// Self-contained on purpose: this string is evaluated standalone in node:test
// and interpolated into the shell, so it may reference nothing from either scope.
const BADGE_R_PX = 9;
const RIM_STROKE_PX = 2;
const SLOT_ANGLES = {"T":90,"TR":45,"TL":135,"BR":-45,"BL":225,"B":270};
const EVENT_SLOTS = ["TR","BR","BL","TL","B","T"];
const DEMAND_SLOTS = ["T","BL","BR","TL","TR","B"];

// djb2, the same string-hash idiom map-scatter.ts and profile-share.ts use.
// COPIED, not imported (this string has no module scope) — it only needs to be
// well-mixed and stable, not cryptographic.
function djb2(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i += 1) h = (Math.imul(h, 33) ^ s.charCodeAt(i)) >>> 0;
  return h >>> 0;
}

function haversineM(aLat, aLng, bLat, bLng) {
  const toRad = Math.PI / 180;
  const dLat = (bLat - aLat) * toRad;
  const dLng = (bLng - aLng) * toRad;
  const s = Math.sin(dLat / 2) * Math.sin(dLat / 2)
    + Math.cos(aLat * toRad) * Math.cos(bLat * toRad) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
  return 2 * 6371000 * Math.asin(Math.min(1, Math.sqrt(s)));
}

// A box's real reach along the slot direction. A 48x26 pill at T extends 13 px,
// not its 27 px half-diagonal, so the gap/overlap constants are honoured in
// EVERY slot rather than only the diagonals (round-4 R3).
function extentAlong(w, h, theta) {
  return Math.abs((w / 2) * Math.cos(theta)) + Math.abs((h / 2) * Math.sin(theta));
}

function discsHit(x1, y1, r1, x2, y2, r2) {
  return Math.hypot(x1 - x2, y1 - y2) < r1 + r2;
}

function dockLayout(input) {
  const mode = input.mode;
  const groundM = input.groundM;
  const gapPx = input.gapPx;
  const overlapPx = input.overlapPx;
  // Local copy: step 6 appends promoted satellite-anchors, and the caller's
  // array is never mutated.
  const anchors = (input.anchors || []).slice();

  // (1) A folded pill is not a satellite at all.
  const live = (input.satellites || []).filter(function (s) { return !s.folded; });

  // (2) Deterministic, input-order-independent order: every demand badge first
  // (it is the smaller, more urgent glyph and owns the axial slots), then event
  // pills, each by djb2(id) so no id text buys a permanent best slot.
  const ordered = live.slice().sort(function (a, b) {
    const ka = a.kind === 'gig' ? 0 : 1;
    const kb = b.kind === 'gig' ? 0 : 1;
    if (ka !== kb) return ka - kb;
    const ha = djb2(String(a.id));
    const hb = djb2(String(b.id));
    if (ha !== hb) return ha - hb;
    const ia = String(a.id);
    const ib = String(b.id);
    return ia < ib ? -1 : ia > ib ? 1 : 0;
  });

  // A Map, never a plain object: anchor ids are member-derived strings (place
  // keys, profile ids) and placed['constructor'] on an object literal returns a
  // function, whose .push would throw and take the whole pass down.
  const placed = new Map(); // anchor id -> [{ x, y, rad }] already docked there
  const out = [];

  for (let i = 0; i < ordered.length; i++) {
    const s = ordered[i];
    const halfDiag = Math.hypot(s.w, s.h) / 2;

    // An unmeasurable box (the host read the element mid-transition and got
    // NaN) would otherwise produce a NaN offset, which setOffset accepts and
    // paints as a vanished marker. Stay put instead — the same doctrine as a
    // full anchor: never a wrong placement. A coordinate-less satellite
    // (NaN/undefined lat or lng) gets the identical treatment, and for the
    // identical reason: it must never dock on pixels alone (see the ground-gate
    // inversion below, which independently refuses it too — belt and braces).
    if (
      !Number.isFinite(halfDiag) ||
      !Number.isFinite(s.x) ||
      !Number.isFinite(s.y) ||
      !Number.isFinite(s.lat) ||
      !Number.isFinite(s.lng)
    ) {
      out.push({ id: s.id, dx: 0, dy: 0, anchor: null, slot: null });
      continue;
    }

    // (3) Same-ground gate FIRST, then the screen test; nearest centre wins,
    // ties broken by id so the winner never depends on array order.
    //
    // The comparison is written as "continue unless provably within range",
    // never "continue if provably out of range": haversineM returns NaN for a
    // non-finite anchor coordinate, and NaN compares false against anything —
    // so the ORIGINAL "> groundM" form let a NaN distance sail through as
    // "not greater", docking a same-PIXEL, different-ground (or coordinate-
    // less) pair onto whichever pin sat nearest on screen. groundM arriving
    // undefined failed the identical way (any distance "> undefined" is also
    // false). The inverted form fails CLOSED in all three cases: an anchor
    // with a non-finite lat/lng is never a candidate, and an undefined
    // groundM admits no anchor at all.
    let best = null;
    let bestDist = Infinity;
    for (let j = 0; j < anchors.length; j++) {
      const a = anchors[j];
      if (a.accepts !== 'all' && !(a.accepts === 'gig' && s.kind === 'gig')) continue;
      if (!(haversineM(a.lat, a.lng, s.lat, s.lng) <= groundM)) continue;
      const dist = Math.hypot(a.x - s.x, a.y - s.y);
      const reach = mode === 'pins' ? a.r + halfDiag + gapPx : a.r + halfDiag;
      if (dist >= reach) continue;
      if (dist < bestDist || (dist === bestDist && best && String(a.id) < String(best.id))) {
        best = a;
        bestDist = dist;
      }
    }

    if (!best) {
      // Nothing under it: never moved (ADR-0024).
      out.push({ id: s.id, dx: 0, dy: 0, anchor: null, slot: null });
      // (6) ...but several same-ground pills with no creator anchor still need
      // to stop stacking on each other: the first in order holds its ground and
      // becomes the rest's anchor, with radius = its own half-height.
      if (hasSameGroundPeer(ordered, s, groundM)) {
        anchors.push({
          id: s.id, x: s.x, y: s.y, r: s.h / 2,
          lat: s.lat, lng: s.lng, badgeSlots: [], accepts: 'all',
        });
      }
      continue;
    }

    // (4) First slot whose placed box clears the anchor's own badge and every
    // satellite already docked there. The ceilings are whatever this sweep
    // yields under the real boxes — never the list length.
    const slots = s.kind === 'gig' ? DEMAND_SLOTS : EVENT_SLOTS;
    const taken = placed.get(best.id) || [];
    let chosen = null;
    for (let k = 0; k < slots.length; k++) {
      const name = slots[k];
      const theta = (SLOT_ANGLES[name] * Math.PI) / 180;
      const base = mode === 'pins' ? best.r + gapPx : best.r - overlapPx;
      const d = base + extentAlong(s.w, s.h, theta);
      const cx = best.x + d * Math.cos(theta);
      const cy = best.y - d * Math.sin(theta); // y flipped: math -> screen
      // (4a) The anchor's OWN furniture: every badge on its rim, not just one —
      // the mixed dot carries a single TR count badge today, but a second
      // (Task 3's amber one) sits at TL, and a slot must clear BOTH. bs is the
      // anchor's OWN standoff when it gave one (the mixed dot's badges sit
      // farther out than a plain bubble's — see DOT_BADGE_STANDOFF_PX's own
      // comment for the arithmetic), else the rim-hugging RIM_STROKE_PX default.
      const badgeSlots = best.badgeSlots || [];
      const bs = Number.isFinite(best.badgeStandoff) ? best.badgeStandoff : RIM_STROKE_PX;
      let badgeBlocked = false;
      for (let bi = 0; bi < badgeSlots.length; bi++) {
        const bt = (SLOT_ANGLES[badgeSlots[bi]] * Math.PI) / 180;
        const bx = best.x + (best.r + bs) * Math.cos(bt);
        const by = best.y - (best.r + bs) * Math.sin(bt);
        if (discsHit(cx, cy, halfDiag, bx, by, BADGE_R_PX)) { badgeBlocked = true; break; }
      }
      if (badgeBlocked) continue;
      let blocked = false;
      for (let t = 0; t < taken.length; t++) {
        if (discsHit(cx, cy, halfDiag, taken[t].x, taken[t].y, taken[t].rad)) { blocked = true; break; }
      }
      if (blocked) continue;
      chosen = { name: name, cx: cx, cy: cy };
      break;
    }

    // (5) No free slot: stay put. Never a wrong slot.
    if (!chosen) {
      out.push({ id: s.id, dx: 0, dy: 0, anchor: null, slot: null });
      continue;
    }
    taken.push({ x: chosen.cx, y: chosen.cy, rad: halfDiag });
    placed.set(best.id, taken);
    out.push({
      id: s.id,
      dx: chosen.cx - s.x,
      dy: chosen.cy - s.y,
      anchor: best.id,
      slot: chosen.name,
    });
  }
  return out;
}

// Step 6's precondition: another VISIBLE satellite of the same kind, on the same
// ground. Same-ground, not "one coordinate" — after the host's 950 m event
// scatter these are metres apart, which the ground gate admits and the pixel
// test then decides on.
function hasSameGroundPeer(all, s, groundM) {
  for (let i = 0; i < all.length; i++) {
    const o = all[i];
    if (o === s || o.kind !== s.kind) continue;
    if (haversineM(o.lat, o.lng, s.lat, s.lng) <= groundM) return true;
  }
  return false;
}

// The auto-fit. trimOutliers keeps ONE poisoned coordinate from collapsing the
// initial frame to a hemisphere; it is a no-op for small or genuinely wide sets.
// maxZoom is CITY_ZOOM (was 12): the cap only bites for a tight/one-city set,
// which is precisely the case where the scatter ring needs 12.5 to read as
// separate pins rather than a smudge.
function fitAll() {
  const pts = trimOutliers(POINTS);
  if (pts.length) pmove(() => map.fitBounds(boundsOf(pts), { padding: 70, maxZoom: CITY_ZOOM, duration: 900 }));
}

// City focus is derived from the data, not a hardcoded gazetteer: zoom to
// the bounds of that city's creators, wherever they happen to be. That is also
// why it needs the same outlier trim: the city STRING is a free distribution key
// we never validate against a centroid, so a row claiming city='Berlin' with a
// mid-Atlantic coordinate would otherwise permanently break the Berlin chip for
// every viewer. Trimming the CAMERA (not the data) is the only fix compatible
// with PLACE-ARCHITECTURE.md invariant #1.
window.focusCity = function (city) {
  if (!city) { fitAll(); return; }
  const all = POINTS.filter(p => p.city === city);
  if (!all.length) return;
  const pts = trimOutliers(all);
  if (pts.length === 1) {
    pmove(() => map.flyTo({ center: [pts[0].lng, pts[0].lat], zoom: CITY_ZOOM, duration: 1100 }));
  } else {
    // maxZoom 13 is already above CITY_ZOOM, so a tight city ring is allowed to
    // go one step closer than the global fit. Left as-is.
    pmove(() => map.fitBounds(boundsOf(pts), { padding: 90, maxZoom: 13, duration: 1100 }));
  }
};

// No viewport ('moved') emit any more: the map is a view, not a query, so camera
// movement reports nothing to the host. (The old loop emitted the bbox on every
// settle to drive "Search this area" / "Search as I move", both removed.)
map.on('click', (e) => {
  // Picker mode: a map click moves the draggable marker (and reports it). The
  // discovery map has NO "search near here" pick any more — the viewport is the
  // query — so a plain map click does nothing in browse mode.
  if (pickerMarker) {
    pickerMarker.setLngLat(e.lngLat);
    window.notify({ type: 'picked', lng: e.lngLat.lng, lat: e.lngLat.lat });
    return;
  }
  // Click on the map BACKGROUND with a card open → dismiss it (user control &
  // freedom). popupJustOpened is true only for the same-tick opening click, so
  // tapping a pin still opens its card; a later tap on empty map closes it.
  if (openPopup && !popupJustOpened) openPopup.remove();
});

// Keyboard a11y (user control & freedom): ESC dismisses the open card, mirroring
// the click-outside behaviour above for keyboard / screen-reader users. The cards
// are closeButton:false, so without this there is no key-only way to dismiss them.
document.addEventListener('keydown', function (e) {
  if ((e.key === 'Escape' || e.key === 'Esc') && openPopup) openPopup.remove();
});
</script>
</body>
