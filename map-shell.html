    // Either end may be null, so a one-sided range still renders one date
    // instead of a dangling dash.
    const dates = from && to ? from + '–' + to : from || to;
    const popup = new maplibregl.Popup({ offset: 18, closeButton: false, maxWidth: '250px', className: 'gigshot-popup' })
      .setHTML(
        '<div style="width:210px;padding:12px 14px;font-family:system-ui,sans-serif">' +
          '<div style="font-size:13px;font-weight:800;color:' + C.cyan + '">🎪 ' + esc(pt.name || 'Event') + '</div>' +
          // Zero-crew face (Z3): the count line becomes the honest story line.
          // esc() on the count arm only — 'No crew here yet' is a literal.
          '<div style="font-size:12px;color:' + C.mutedStrong + ';margin-top:6px">' + (going ? esc(going) + ' going' : 'No crew here yet') + '</div>' +
          (pt.gigCount ? '<div style="font-size:12px;color:' + C.mutedStrong + ';margin-top:2px">' + esc(pt.gigCount) + ' open ' + (pt.gigCount === 1 ? 'gig' : 'gigs') + '</div>' : '') +
          (dates ? '<div style="font-size:11px;color:' + C.muted + ';margin-top:2px">' + dates + '</div>' : '') +
          // The "near" line is shown ONLY for an inferred coordinate: on a precise
          // pin it would claim the event is somewhere it is not.
          (approx && pt.nearCity
            ? '<div style="font-size:11px;color:' + C.muted + ';margin-top:2px">near ' + esc(pt.nearCity) + '</div>'
            : '') +
          // The CTA wears the event-pill family treatment (translucent cyan +
          // cyan border + near-white ink), NOT solid cyan with dark ink: the
          // app-wide button rule is white text (ui.tsx btnText), and white only
          // reads on a deep fill — solid C.cyan is too light for it, which is
          // how this button ended up the one dark-ink outlier (founder call,
          // 2026-08-19: white like every other button). Spell the hue as
          // C.cyan only: the token test counts the raw hex ONCE per document.
          // Zero-crew CTA (Z3): same class, same notify route — only the label
          // changes, because the place page's zero-crew face already offers
          // I'm-available and 'See who's going' over nobody would be a lie.
          '<button class="gs-event-going" ' +
            'style="margin-top:10px;width:100%;padding:8px;border:2px solid ' + C.cyan + ';border-radius:8px;cursor:pointer;' +
            'background:' + rgbaOf(C.cyan, 0.22) + ';color:#e6fbff;font-weight:800;font-size:13px">' + (going ? 'See who’s going' : 'Be the first') + '</button>' +
        '</div>'
      );
    popup.on('open', () => {
      // Shared tracker: click-outside and ESC close this card, and it can never
      // stack with a supply or demand card.
      markPopupOpen(popup);
      // Bind via a CLOSURE (pt.placeKey captured), never an interpolated onclick
      // string: an HTML attribute plus a JS string is a double context that
      // entity-decodes before the JS parses. A place key is a server slug today,
      // and the DOM listener removes the footgun whatever it becomes.
      const pel = popup.getElement();
      const btn = pel && pel.querySelector('.gs-event-going');
      if (btn) btn.onclick = () => window.notify({ type: 'event', placeKey: pt.placeKey });
    });
    popup.on('close', () => { if (openPopup === popup) openPopup = null; });
    // anchor CENTER with NO setOffset. A pixel offset is a fixed SCREEN distance
    // but a varying GROUND distance, which is how a 30px nudge once threw a
    // Berlin badge into the Baltic at low zoom. Event pins need no dodge at all:
    // same-coordinate events are separated host-side by scatterColliding.
    const m = new maplibregl.Marker({ element: el, anchor: 'center' })
      .setLngLat([pt.lng, pt.lat])
      .setPopup(popup)
      .addTo(map);
    eventMarkers.push(m);
  }
};

map.on('load', () => {
  retintMap(map);
  window.setPoints(POINTS);
  // Stated explicitly rather than left to setPoints' internals: the seam must
  // have a decided mode before the first gesture, or the first zoomend is the
  // one that creates it and the initial frame renders with neither side gated.
  // Latched, so the (usual) case where setPoints already settled it is free.
  applyAggMode();
  window.notify({ type: 'ready' });
});

function boundsOf(pts) {
  const b = new maplibregl.LngLatBounds();
  for (const p of pts) b.extend([p.lng, p.lat]);
  return b;
}

// See the trimOutliersJs doc comment in src/lib/mapHtml.ts for the full WHY.
// Robust (median + median-distance) outlier trim for the auto-fit camera only.
// It NEVER touches the rendered point set, only which points the camera frames.
function trimOutliers(pts) {
  if (!pts || !pts.length) return pts;
  const fin = [];
  for (const p of pts) {
    if (Number.isFinite(p.lat) && Number.isFinite(p.lng)) fin.push(p);
  }
  // Too few points to tell an outlier from the distribution: leave it alone
  // (return the ORIGINAL array so non-finite rows keep their previous handling).
  if (fin.length < 8) return pts;
  const med = function (xs) {
    const s = xs.slice().sort(function (a, b) { return a - b; });
    const h = s.length >> 1;
    return s.length % 2 ? s[h] : (s[h - 1] + s[h]) / 2;
  };
  const mLat = med(fin.map(function (p) { return p.lat; }));
  const mLng = med(fin.map(function (p) { return p.lng; }));
  // Scale longitude by cos(lat) so a "degree" means the same ground distance on
  // both axes (1 deg of longitude is ~62km at 55N vs ~111km at the equator).
  // Near-pole guard mirrors map-scatter.ts.
  const cosLat = Math.max(Math.cos(mLat * Math.PI / 180), 0.01);
  const d = fin.map(function (p) {
    const dy = p.lat - mLat;
    const dx = (p.lng - mLng) * cosLat;
    return Math.sqrt(dy * dy + dx * dx);
  });
  // The floor is 20 SCALED DEGREES (~2200km), not a tight number, and that is
  // load-bearing: this trim exists ONLY to stop a poisoned coordinate (null
  // island, swapped lat/lng, mid-Atlantic) from collapsing the initial fit to a
  // hemisphere — it must NEVER drop an honest cohort. At floor 5 it did exactly
  // that on our own launch geography: 15 Berlin + 4 Barcelona dropped all four
  // Spanish creators from the first frame, so a Spaniard opened the app and
  // their own country was out of view. Any honest intra-European set stays
  // inside 20; all three poison vectors still trip it (null island ~52 scaled
  // deg from a European mass, swapped lat/lng ~39, mid-Atlantic ~39).
  const keepR = Math.max(med(d) * 6, 20);
  const kept = [];
  for (let i = 0; i < fin.length; i++) {
    if (d[i] <= keepR) kept.push(fin[i]);
  }
  // Nothing was an outlier: hand the ORIGINAL array back, so the common case is
  // free and identity-stable (same idiom as map-scatter.ts's "when nothing
  // collides the input array is returned unchanged").
  if (kept.length === pts.length) return pts;
  // Dropping a lot means the data is genuinely spread out, not poisoned: fit it all.
  if (kept.length < 3 || kept.length < fin.length * 0.75) return pts;
  return kept;
}


// See the aggModeJs doc comment in src/lib/mapHtml.ts for the full WHY.
const AGG_IN = 6.15;   // pins earned here (ONE number, interpolated from the TS const)
const AGG_OUT = 5.85;  // bubbles earned only well BELOW it: the gap between the two IS the hysteresis
function aggModeFor(prevMode, zoom, count) {
  if (count > 60) return 'bubbles'; // DOM_MARKER_LIMIT: cluster-only at any zoom
  if (prevMode !== 'bubbles' && prevMode !== 'pins') return zoom < 6 ? 'bubbles' : 'pins'; // 6 mirrors PHOTO_ZOOM (mapHtml.ts): kept in sync by comment only, same reason as the 60/DOM_MARKER_LIMIT pair, since this string is evaluated standalone in tests
  if (prevMode === 'bubbles') return zoom >= AGG_IN ? 'pins' : 'bubbles';
  return zoom <= AGG_OUT ? 'bubbles' : 'pins';
}

// The auto-fit. trimOutliers keeps ONE poisoned coordinate from collapsing the
// initial frame to a hemisphere; it is a no-op for small or genuinely wide sets.
// maxZoom is CITY_ZOOM (was 12): the cap only bites for a tight/one-city set,
// which is precisely the case where the scatter ring needs 12.5 to read as
// separate pins rather than a smudge.
function fitAll() {
  const pts = trimOutliers(POINTS);
  if (pts.length) pmove(() => map.fitBounds(boundsOf(pts), { padding: 70, maxZoom: CITY_ZOOM, duration: 900 }));
}

// City focus is derived from the data, not a hardcoded gazetteer: zoom to
// the bounds of that city's creators, wherever they happen to be. That is also
// why it needs the same outlier trim: the city STRING is a free distribution key
// we never validate against a centroid, so a row claiming city='Berlin' with a
// mid-Atlantic coordinate would otherwise permanently break the Berlin chip for
// every viewer. Trimming the CAMERA (not the data) is the only fix compatible
// with PLACE-ARCHITECTURE.md invariant #1.
window.focusCity = function (city) {
  if (!city) { fitAll(); return; }
  const all = POINTS.filter(p => p.city === city);
  if (!all.length) return;
  const pts = trimOutliers(all);
  if (pts.length === 1) {
    pmove(() => map.flyTo({ center: [pts[0].lng, pts[0].lat], zoom: CITY_ZOOM, duration: 1100 }));
  } else {
    // maxZoom 13 is already above CITY_ZOOM, so a tight city ring is allowed to
    // go one step closer than the global fit. Left as-is.
    pmove(() => map.fitBounds(boundsOf(pts), { padding: 90, maxZoom: 13, duration: 1100 }));
  }
};

// No viewport ('moved') emit any more: the map is a view, not a query, so camera
// movement reports nothing to the host. (The old loop emitted the bbox on every
// settle to drive "Search this area" / "Search as I move", both removed.)
map.on('click', (e) => {
  // Picker mode: a map click moves the draggable marker (and reports it). The
  // discovery map has NO "search near here" pick any more — the viewport is the
  // query — so a plain map click does nothing in browse mode.
  if (pickerMarker) {
    pickerMarker.setLngLat(e.lngLat);
    window.notify({ type: 'picked', lng: e.lngLat.lng, lat: e.lngLat.lat });
    return;
  }
  // Click on the map BACKGROUND with a card open → dismiss it (user control &
  // freedom). popupJustOpened is true only for the same-tick opening click, so
  // tapping a pin still opens its card; a later tap on empty map closes it.
  if (openPopup && !popupJustOpened) openPopup.remove();
});

// Keyboard a11y (user control & freedom): ESC dismisses the open card, mirroring
// the click-outside behaviour above for keyboard / screen-reader users. The cards
// are closeButton:false, so without this there is no key-only way to dismiss them.
document.addEventListener('keydown', function (e) {
  if ((e.key === 'Escape' || e.key === 'Esc') && openPopup) openPopup.remove();
});
</script>
</body>
</html>
